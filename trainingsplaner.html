      <div class="section-h"><h2>So arbeitest du damit</h2></div>
      <div class="grid-3">
        <div class="card"><span class="eyebrow">Schritt 1</span><h3 style="margin:3px 0 6px">Team &amp; Kader</h3>
          <p style="font-size:.9rem;color:var(--ink-2)">Teamname, Altersklasse (G-Junioren bis Aktive), Trainingstage und Spieler eintragen.</p></div>
        <div class="card"><span class="eyebrow">Schritt 2</span><h3 style="margin:3px 0 6px">Plan erzeugen</h3>
          <p style="font-size:.9rem;color:var(--ink-2)">Wochen-, Monats-, Halbjahres- oder Jahresplan sowie Sommer- und Wintervorbereitung – altersgerecht vorbelegt.</p></div>
        <div class="card"><span class="eyebrow">Schritt 3</span><h3 style="margin:3px 0 6px">Erfassen &amp; auswerten</h3>
          <p style="font-size:.9rem;color:var(--ink-2)">Anwesenheit und Kommentar je Einheit – Grafiken und Themenabdeckung entstehen automatisch.</p></div>
      </div>
    </section>
    <section class="section">
      <div class="section-h">
        <h2>Beispielauswertung</h2>
        <p>Beispieldaten einer E-Jugend – nur zur Ansicht. Sobald du eigene Einheiten erfasst, zeigt die Analyse deine echten Zahlen.</p>
      </div>
      <div class="tiles" style="margin-bottom:14px">
        <div class="tile"><span class="k">Einheiten</span><span class="v">${st.units}</span><span class="s">Beispiel</span></div>
        <div class="tile"><span class="k">Ø Anwesenheit</span><span class="v">${st.quote}<span style="font-size:1rem"> %</span></span><span class="s">${st.da} von ${st.base}</span></div>
        <div class="tile"><span class="k">Themen abgedeckt</span><span class="v">${Object.keys(st.themes).length}<span style="font-size:1rem">/${THEMES.length}</span></span><span class="s">Beispiel</span></div>
        <div class="tile"><span class="k">Kader</span><span class="v">${dd.players.length}</span><span class="s">Beispiel</span></div>
      </div>
      <div class="stack">
        <div class="chart">
          <div class="chart-h"><h3>Anwesenheit je Einheit</h3><span class="sub">Beispieldaten</span></div>
          ${chartAttendance(dd.sessions)}${ATT_LEGEND}
        </div>
        <div class="chart">
          <div class="chart-h"><h3>Trainingsthemen</h3><span class="sub">Einheiten je Thema</span></div>
          ${barRows(themeRows, "")}
        </div>
      </div>
    </section>`;
  }
  const t0 = curTeam();
  const now = new Date(), mk = monthKey(iso(now));
  const allS = Store.allSessions();
  const mineIds = mine.map(function(t){ return t.id; });
  const monthS = allS.filter(function(e){ return mineIds.indexOf(e.teamId)>=0 && monthKey(e.date)===mk; });
  const last30 = allS.filter(function(e){ return mineIds.indexOf(e.teamId)>=0 && e.date >= iso(addDays(now,-30)); });
  const st30 = statsFor(last30, []);
  const themesAll = uniq(allS.filter(function(e){ return mineIds.indexOf(e.teamId)>=0; }).reduce(function(a,e){ return a.concat(e.themes||[]); },[]));
  const comments = allS.filter(function(e){ return mineIds.indexOf(e.teamId)>=0 && e.komm; }).slice(-6).reverse();

  let teamCards = mine.map(function(t){
    const s = Store.sessions(t.id), last = s[s.length-1];
    const stT = statsFor(s, t.players||[]);
    const plan = Store.plan(t.id);
    let next = null;
    if(plan){
      const today = iso(new Date());
      plan.weeks.forEach(function(w){ (w.units||[]).forEach(function(u){ if(u.date>=today && (!next || u.date<next.date)) next=u; }); });
    }
    return `<div class="card">
      <div class="row" style="justify-content:space-between;align-items:flex-start">
        <div><h3>${esc(t.name)}</h3>
          <div style="font-size:.84rem;color:var(--muted)">${esc(ageLabel(t.age))}${t.club?" · "+esc(t.club):""}</div></div>
        <span class="badge badge-a">${esc(t.age)}</span>
      </div>
      <div class="tiles" style="margin:12px 0">
        <div class="tile"><span class="k">Einheiten</span><span class="v">${stT.units}</span></div>
        <div class="tile"><span class="k">Ø Anwesenheit</span><span class="v">${stT.units?stT.quote+" %":"–"}</span></div>
        <div class="tile"><span class="k">Kader</span><span class="v">${(t.players||[]).length}</span></div>
      </div>
      <p style="font-size:.86rem;color:var(--ink-2)">
        ${last ? "Letzte Einheit: <b>"+esc(fmtDate(last.date))+"</b> · "+esc((last.themes||[]).map(themeName).join(", ")) : "Noch keine Einheit erfasst."}<br>
        ${next ? "Nächste geplante Einheit: <b>"+esc(fmtDate(next.date))+"</b> · "+esc((next.themes||[]).map(themeName).join(", ")) : (plan?"Keine weitere Einheit im gespeicherten Plan.":"Noch kein Plan gespeichert.")}
      </p>
      <div class="row" style="margin-top:12px">
        <button class="btn btn-p btn-s" data-act="logTeam" data-id="${t.id}">Training erfassen</button>
        <button class="btn btn-s" data-act="planTeam" data-id="${t.id}">Plan</button>
        <button class="btn btn-s" data-act="anaTeam" data-id="${t.id}">Analyse</button>
        <button class="btn btn-s btn-q" data-act="editTeam" data-id="${t.id}">Bearbeiten</button>
      </div>
    </div>`;
  }).join("");

  return `
    ${!Store.me.name ? `<div class="banner"><div class="grow"><b>Dein Name fehlt noch.</b> Er kennzeichnet deine Teams in der Vereinsübersicht.</div>
      <input type="text" id="meName" value="" placeholder="Name eintragen" data-ch="meName" style="max-width:200px"></div>` : ""}
    <section class="section">
      <div class="tiles">
        <div class="tile"><span class="k">Meine Teams</span><span class="v">${mine.length}</span><span class="s">${all.length>mine.length?(all.length-mine.length)+" weitere im Verein":"im Verein"}</span></div>
        <div class="tile"><span class="k">Einheiten ${MON[now.getMonth()]}</span><span class="v">${monthS.length}</span><span class="s">${monthLabel(mk)}</span></div>
        <div class="tile"><span class="k">Ø Anwesenheit</span><span class="v">${st30.base?st30.quote+"<span style=\"font-size:1rem\"> %</span>":"–"}</span><span class="s">letzte 30 Tage</span></div>
        <div class="tile"><span class="k">Themen abgedeckt</span><span class="v">${themesAll.length}<span style="font-size:1rem">/${THEMES.length}</span></span><span class="s">gesamter Zeitraum</span></div>
      </div>
    </section>
    <section class="section">
      <div class="section-h"><h2>Meine Teams</h2>
        <button class="btn btn-s" data-act="newTeam" style="margin-left:auto">+ Team anlegen</button></div>
      <div class="grid-3">${teamCards}</div>
    </section>
    ${comments.length ? `<section class="section">
      <div class="section-h"><h2>Letzte Kommentare</h2><p>Notizen aus deinen zuletzt erfassten Einheiten.</p></div>
      <div class="stack">${comments.map(function(e){
        const t = Store.team(e.teamId);
        return `<div class="card" style="padding:12px 14px">
          <div style="font-size:.78rem;color:var(--muted);font-weight:700">${esc(fmtDate(e.date))} · ${esc(t?t.name:"Team")} · ${esc((e.themes||[]).map(themeName).join(" / "))}</div>
          <p style="margin-top:4px;font-size:.92rem">${esc(e.komm)}</p></div>`;
      }).join("")}</div></section>` : ""}
    ${all.length>mine.length ? `<section class="section">
      <div class="section-h"><h2>Weitere Teams im Verein</h2><p>Von anderen Trainern angelegt – für die Gesamtübersicht sichtbar.</p></div>
      <div class="tbl-wrap"><table><thead><tr><th>Team</th><th>Altersklasse</th><th>Trainer</th><th class="n">Einheiten</th><th class="n">Ø Anwesenheit</th></tr></thead><tbody>
      ${all.filter(function(t){ return mineIds.indexOf(t.id)<0; }).map(function(t){
        const s = Store.sessions(t.id), stt = statsFor(s, t.players||[]);
        return `<tr><td class="wrap-ok"><b>${esc(t.name)}</b></td><td>${esc(ageShort(t.age))}</td><td>${esc(trainerName(t.trainerId))}</td>
          <td class="n">${stt.units}</td><td class="n">${stt.base?stt.quote+" %":"–"}</td></tr>`;
      }).join("")}</tbody></table></div></section>` : ""}`;
}

/* ---------- Ansicht: Teams & Kader ---------- */
function vTeams(){
  if(S.teamForm) return teamFormHTML(S.teamForm);
  const mine = Store.myTeams();
  if(!mine.length) return `<div class="empty"><h3>Noch kein Team angelegt</h3>
    <p>Ein Team braucht nur einen Namen und eine Altersklasse – alles andere kannst du später ergänzen.</p>
    <button class="btn btn-p" data-act="newTeam">Team anlegen</button></div>`;
  return `<section class="section">
    <div class="section-h"><h2>Meine Teams</h2><p>Kader, Trainingstage und Einheitsdauer bestimmen die Planvorschläge.</p>
      <button class="btn btn-s btn-p" data-act="newTeam" style="margin-left:auto">+ Team anlegen</button></div>
    <div class="stack">${mine.map(function(t){
      const pl = t.players||[];
      return `<div class="card">
        <div class="row" style="justify-content:space-between;align-items:flex-start">
          <div>
            <h3>${esc(t.name)}</h3>
            <div style="font-size:.85rem;color:var(--muted)">${esc(ageLabel(t.age))} · Saison ${esc(t.season||"–")}${t.club?" · "+esc(t.club):""}</div>
          </div>
          <div class="row">
            <button class="btn btn-s" data-act="editTeam" data-id="${t.id}">Bearbeiten</button>
            <button class="btn btn-s btn-q btn-d" data-act="delTeam" data-id="${t.id}">Löschen</button>
          </div>
        </div>
        <div class="row" style="margin-top:10px;gap:16px;font-size:.88rem;color:var(--ink-2)">
          <span><b>Trainingstage:</b> ${(t.days||[]).length?(t.days||[]).map(function(d){return DAYS[d];}).join(", "):"–"}</span>
          <span><b>Dauer:</b> ${t.dauer||AG[t.age].min} Min.</span>
          <span><b>Spieltag:</b> ${t.matchDay>=0?DAYS[t.matchDay]:"kein fester Spieltag"}</span>
          <span><b>Kader:</b> ${pl.length} Spieler</span>
        </div>
        <div class="note note-a" style="margin-top:12px"><b>Hinweis zur Altersklasse:</b> ${esc(AG[t.age].tip)}</div>
        ${pl.length ? `<div class="tbl-wrap" style="margin-top:12px"><table><thead><tr><th>Nr.</th><th>Name</th><th>Jahrgang</th><th>Position</th></tr></thead><tbody>
          ${pl.map(function(p,i){ return `<tr><td class="n">${i+1}</td><td class="wrap-ok">${esc(p.name)}</td><td>${esc(p.born||"–")}</td><td>${esc(p.pos||"–")}</td></tr>`; }).join("")}
        </tbody></table></div>` : `<p style="margin-top:12px;color:var(--muted);font-size:.9rem">Noch keine Spieler im Kader – ohne Kader gibt es keine Anwesenheitsliste.</p>`}
      </div>`;
    }).join("")}</div></section>`;
}
function teamFormHTML(f){
  const isNew = !f.id;
  const pl = f.players||[];
  return `<section class="section">
    <div class="section-h"><h2>${isNew?"Neues Team":"Team bearbeiten"}</h2>
      <button class="btn btn-s btn-q" data-act="cancelTeam" style="margin-left:auto">Abbrechen</button></div>
    <div class="card">
      <div class="grid-2">
        <label class="field"><span>Teamname *</span><input type="text" data-tf="name" value="${esc(f.name||"")}" placeholder="z. B. FC Muster E1"></label>
        <label class="field"><span>Verein</span><input type="text" data-tf="club" value="${esc(f.club||"")}" placeholder="z. B. FC Muster"></label>
        <label class="field"><span>Altersklasse *</span>
          <select data-tf="age">${AGES.map(function(a){ return `<option value="${a.id}"${f.age===a.id?" selected":""}>${esc(a.n)} · ${esc(a.u)}</option>`; }).join("")}</select></label>
        <label class="field"><span>Saison</span><input type="text" data-tf="season" value="${esc(f.season||"")}" placeholder="z. B. 2026/27"></label>
        <label class="field"><span>Einheitsdauer (Minuten)</span><input type="number" min="30" max="150" step="5" data-tf="dauer" value="${f.dauer||AG[f.age||"E"].min}"></label>
        <label class="field"><span>Spieltag</span>
          <select data-tf="matchDay">
            <option value="-1"${f.matchDay===-1||f.matchDay==null?" selected":""}>kein fester Spieltag</option>
            ${DAYS.map(function(d,i){ return `<option value="${i}"${f.matchDay===i?" selected":""}>${d}</option>`; }).join("")}
          </select>
          <span class="hint">Die letzte Einheit vor dem Spieltag wird als Spielvorbereitung geplant.</span></label>
      </div>
      <div class="field" style="margin-top:14px">
        <span>Trainingstage</span>
        <div class="row">${DAYS.map(function(d,i){
          const on = (f.days||[]).indexOf(i)>=0;
          return `<button type="button" class="chip" aria-pressed="${on}" data-act="tfDay" data-i="${i}">${d}</button>`;
        }).join("")}</div>
      </div>
      <div class="note note-a" style="margin-top:14px"><b>${esc(ageLabel(f.age||"E"))}:</b> ${esc(AG[f.age||"E"].tip)}</div>
    </div>

    <div class="card" style="margin-top:16px">
      <h3>Kader</h3>
      <p style="font-size:.88rem;color:var(--ink-2);margin:4px 0 12px">Die Namen bilden die Anwesenheitsliste. Änderungen wirken nur auf künftige Einheiten – bereits erfasste Listen bleiben unverändert.</p>
      ${pl.length ? `<div class="att-list" style="margin-bottom:12px">${pl.map(function(p,i){
        return `<div class="att-r"><div class="att-n">${esc(p.name)}<small>${esc(p.born||"Jahrgang ?")} · ${esc(p.pos||"Position offen")}</small></div>
          <div class="att-btns"><button type="button" data-act="tfDelPlayer" data-i="${i}">entfernen</button></div></div>`;
      }).join("")}</div>` : ""}
      <div class="grid-2" style="align-items:end">
        <label class="field"><span>Name</span><input type="text" id="npName" placeholder="Vorname Nachname"></label>
        <label class="field"><span>Jahrgang</span><input type="number" id="npBorn" placeholder="2014" min="1950" max="2030"></label>
        <label class="field"><span>Position</span>
          <select id="npPos"><option value="">offen</option><option>TW</option><option>IV</option><option>AV</option><option>MF</option><option>FL</option><option>ST</option></select></label>
        <div><button class="btn" data-act="tfAddPlayer">Spieler hinzufügen</button></div>
      </div>
      <details style="margin-top:14px">
        <summary style="cursor:pointer;font-weight:600;font-size:.9rem">Mehrere Spieler auf einmal einfügen</summary>
        <label class="field" style="margin-top:8px"><span>Eine Zeile pro Spieler – optional „Name; Jahrgang; Position“</span>
          <textarea id="bulkPlayers" placeholder="Luca Bauer; 2014; MF&#10;Jonas Meier; 2015; ST"></textarea></label>
        <button class="btn btn-s" data-act="tfBulk" style="margin-top:8px">Liste übernehmen</button>
      </details>
    </div>
    <div class="row" style="margin-top:16px">
      <button class="btn btn-p" data-act="saveTeam">Team speichern</button>
      <button class="btn btn-q" data-act="cancelTeam">Abbrechen</button>
    </div>
  </section>`;
}
</script>

<script>
"use strict";
/* ---------- Ansicht: Trainingsplan ---------- */
function noTeam(msg){
  return `<div class="empty"><h3>Zuerst ein Team anlegen</h3><p>${esc(msg)}</p>
    <button class="btn btn-p" data-act="newTeam">Team anlegen</button></div>`;
}
function vPlan(){
  const t = curTeam();
  if(!t) return noTeam("Planvorschläge richten sich nach Altersklasse, Trainingstagen und Einheitsdauer des Teams.");
  const saved = Store.plan(t.id);
  const show = S.draft || saved;
  const isDraft = !!S.draft;
  return `<section class="section">
    <div class="card">
      <span class="eyebrow">Planart wählen</span>
      <div class="row" style="margin:8px 0 14px">
        ${PLANTYPES.map(function(p){
          return `<button class="chip" aria-pressed="${S.planType===p.id}" data-act="planType" data-id="${p.id}">${esc(p.n)}</button>`;
        }).join("")}
      </div>
      <p style="font-size:.9rem;color:var(--ink-2);max-width:70ch">${esc(PT[S.planType].d)}
        Grundlage: <b>${esc(ageLabel(t.age))}</b>, ${(t.days||[]).length?(t.days||[]).map(function(d){return DAYS[d];}).join("/"):"keine Trainingstage gesetzt"},
        ${t.dauer||AG[t.age].min} Minuten je Einheit.</p>
      <div class="grid-2" style="margin-top:14px;max-width:640px;align-items:end">
        <label class="field"><span>Startdatum</span><input type="date" value="${S.planStart}" data-ch="planStart">
          <span class="hint">Der Plan beginnt mit der Woche, in der dieses Datum liegt.</span></label>
        <div class="row">
          <button class="btn btn-p" data-act="genPlan">Vorschlag erzeugen</button>
          ${isDraft?`<button class="btn" data-act="savePlan">Plan speichern</button>`:""}
        </div>
      </div>
      ${!(t.days||[]).length?`<div class="note" style="margin-top:12px">Für dieses Team sind keine Trainingstage hinterlegt – der Vorschlag nutzt Dienstag und Donnerstag. Trage die echten Tage unter <b>Teams &amp; Kader</b> ein.</div>`:""}
    </div>
  </section>
  ${show ? planHTML(show, t, isDraft) : `<div class="empty"><h3>Noch kein Plan erzeugt</h3>
    <p>Wähle eine Planart und erzeuge einen Vorschlag. Du kannst ihn anschließend speichern – gespeicherte Einheiten erscheinen dann beim Erfassen.</p></div>`}`;
}
function loadBars(n){
  let s = "";
  for(let i=1;i<=5;i++) s += `<i class="${i<=n?"on":""}" style="height:${3+i*2.2}px"></i>`;
  return `<span class="load" title="Belastung ${n} von 5" aria-label="Belastung ${n} von 5">${s}</span>`;
}
function planHTML(plan, team, isDraft){
  const detail = plan.weeks.filter(function(w){ return (w.units||[]).length; });
  const macro = plan.phases.length>1;
  return `
  <section class="section">
    <div class="section-h">
      <h2>${esc(PT[plan.type].n)}${isDraft?" (Vorschlag)":""}</h2>
      <p>${esc(team.name)} · Start ${esc(fmtDate(plan.start))} · ${plan.weeks.length} Woche${plan.weeks.length>1?"n":""}</p>
      <span class="badge ${isDraft?"badge-c":"badge-a"}" style="margin-left:auto">${isDraft?"nicht gespeichert":"gespeichert"}</span>
    </div>
    ${macro?`<div class="pl-macro" style="margin-bottom:18px">${plan.phases.map(function(p){
      return `<div class="pl-mb"><span class="p">${p.w} Woche${p.w>1?"n":""}</span><h4>${esc(p.n)}</h4>
        <p style="font-size:.87rem;color:var(--ink-2);margin-top:4px">${esc(p.ziel)}</p></div>`;
    }).join("")}</div>`:""}
    <div class="tbl-wrap" style="margin-bottom:18px">
      <table><thead><tr><th>KW</th><th>Zeitraum</th><th>Phase</th><th>Schwerpunkt</th><th>Nebenthema</th><th>Belastung</th></tr></thead><tbody>
      ${plan.weeks.map(function(w){
        return `<tr><td class="n">${w.nr}</td><td>${esc(fmtShort(w.from))}–${esc(fmtShort(w.to))}</td>
          <td class="wrap-ok">${esc(w.phase)}</td><td class="wrap-ok"><b>${esc(themeName(w.main))}</b></td>
          <td class="wrap-ok">${esc(themeName(w.second))}</td><td>${loadBars(w.load)}</td></tr>`;
      }).join("")}</tbody></table>
    </div>
    ${plan.weeks.length>detail.length?`<div class="note" style="margin-bottom:16px">Detaillierte Einheiten sind für die ersten ${detail.length} Wochen ausgearbeitet – so bleibt der Langzeitplan übersichtlich.
      Erzeuge zum jeweiligen Zeitpunkt einen Wochen- oder Monatsplan für die Detailplanung.</div>`:""}
    <div class="stack">
      ${detail.map(function(w){
        return `<div class="pl-week">
          <div class="pl-wh">
            <span class="w">Woche ${w.nr}</span>
            <span class="badge">${esc(w.phase)}</span>
            <span style="font-size:.85rem;color:var(--muted)">${esc(fmtShort(w.from))}–${esc(fmtShort(w.to))}</span>
            <span style="font-size:.85rem"><b>${esc(themeName(w.main))}</b> + ${esc(themeName(w.second))}</span>
            <span style="margin-left:auto">${loadBars(w.load)}</span>
          </div>
          <div class="pl-days">
            ${w.units.map(function(u){
              return `<div class="pl-day">
                <div><div class="pl-dd">${esc(fmtDate(u.date))}</div>
                  <div style="font-size:.8rem;color:var(--muted)">${u.dauer} Minuten</div>
                  <button class="btn btn-s btn-q" data-act="logDate" data-id="${team.id}" data-d="${u.date}" style="margin-top:6px;padding:3px 8px">erfassen</button>
                </div>
                <div class="pl-blocks">
                  ${u.hint?`<div class="note" style="margin-bottom:4px;padding:6px 10px;font-size:.84rem">${esc(u.hint)}</div>`:""}
                  ${u.blocks.map(function(b){
                    const ex = EXMAP[b.ex];
                    return `<div class="pl-bl"><span class="ph">${esc(b.ph)} · ${b.min}′</span>
                      <span>${ex?`<button class="pl-ex" data-act="ex" data-id="${ex.id}">${esc(ex.t)}</button>`:"—"}
                        <span style="color:var(--muted);font-size:.82rem"> · ${esc(themeName(b.th))}</span></span></div>`;
                  }).join("")}
                </div></div>`;
            }).join("")}
          </div></div>`;
      }).join("")}
    </div>
    <div class="row" style="margin-top:16px">
      ${isDraft?`<button class="btn btn-p" data-act="savePlan">Plan speichern</button>`:`<button class="btn" data-act="genPlan">Neuen Vorschlag erzeugen</button>`}
      <button class="btn btn-q" data-act="planCsv">Als CSV sichern</button>
    </div>
  </section>`;
}

/* ---------- Ansicht: Training erfassen ---------- */
function initLog(team, dateISO){
  const ex = Store.session(team.id, dateISO);
  if(ex){
    S.log = { date:dateISO, dauer:ex.dauer, art:ex.art||"Training", themes:(ex.themes||[]).slice(),
              exIds:(ex.exIds||[]).slice(), att:Object.assign({}, ex.att||{}), komm:ex.komm||"", existed:true };
    return;
  }
  const plan = Store.plan(team.id);
  let unit = null;
  if(plan) plan.weeks.forEach(function(w){ (w.units||[]).forEach(function(u){ if(u.date===dateISO) unit=u; }); });
  const att = {};
  (team.players||[]).forEach(function(p){ att[p.id] = "da"; });
  S.log = { date:dateISO, dauer: unit?unit.dauer:(team.dauer||AG[team.age].min), art:"Training",
            themes: unit?unit.themes.slice():[], exIds: unit?unit.blocks.map(function(b){ return b.ex; }).filter(Boolean):[],
            att:att, komm:"", existed:false, fromPlan:!!unit };
}
function vLog(){
  const t = curTeam();
  if(!t) return noTeam("Die Anwesenheitsliste entsteht aus dem Kader des Teams.");
  if(!S.log || S.log.teamId!==t.id){ initLog(t, S.log?S.log.date:iso(new Date())); S.log.teamId = t.id; }
  const L = S.log, pl = t.players||[];
  const counts = { da:0, ent:0, ver:0, un:0 };
  Object.keys(L.att).forEach(function(k){ if(counts[L.att[k]]!=null) counts[L.att[k]]++; });
  const base = counts.da+counts.ent+counts.ver+counts.un;
  const sessions = Store.sessions(t.id).slice().reverse();
  return `<section class="section">
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div><span class="eyebrow">${L.existed?"Einheit bearbeiten":"Neue Einheit"}</span>
          <h2 style="margin-top:2px">${esc(fmtDate(L.date))}</h2></div>
        ${L.fromPlan?`<span class="badge badge-a">aus dem Plan übernommen</span>`:""}
        ${L.existed?`<span class="badge badge-c">bereits erfasst</span>`:""}
      </div>
      <div class="grid-2" style="margin-top:14px">
        <label class="field"><span>Datum</span><input type="date" value="${L.date}" data-ch="logDate"></label>
        <label class="field"><span>Dauer (Minuten)</span><input type="number" min="20" max="180" step="5" value="${L.dauer}" data-ch="logDauer"></label>
        <label class="field"><span>Art der Einheit</span>
          <select data-ch="logArt">${["Training","Testspiel","Pflichtspiel","Hallentraining","Athletikeinheit","Teamevent"].map(function(a){
            return `<option${L.art===a?" selected":""}>${a}</option>`; }).join("")}</select></label>
      </div>
      <div class="field" style="margin-top:16px">
        <span>Trainingsthemen (Mehrfachauswahl)</span>
        <div class="row" style="margin-top:2px">${THEMES.map(function(th){
          const on = L.themes.indexOf(th.id)>=0;
          return `<button type="button" class="chip" aria-pressed="${on}" data-act="logTheme" data-id="${th.id}" title="${esc(th.d)}">${esc(th.n)}</button>`;
        }).join("")}</div>
        <span class="hint">Die Themen sind die Grundlage der Auswertung – bitte mindestens eines wählen.</span>
      </div>
      <div class="field" style="margin-top:16px">
        <span>Verwendete Übungen (optional)</span>
        <div class="row">
          <select id="exPick" style="max-width:420px">
            <option value="">Übung auswählen …</option>
            ${THEMES.map(function(th){
              const list = EXERCISES.filter(function(e){ return e.th===th.id; });
              if(!list.length) return "";
              return `<optgroup label="${esc(th.n)}">${list.map(function(e){ return `<option value="${e.id}">${esc(e.t)}</option>`; }).join("")}</optgroup>`;
            }).join("")}
          </select>
          <button class="btn btn-s" data-act="logAddEx">Hinzufügen</button>
        </div>
        ${L.exIds.length?`<div class="row" style="margin-top:8px">${L.exIds.map(function(id){
          const e = EXMAP[id]; if(!e) return "";
          return `<span class="badge">${esc(e.t)} <button class="btn btn-q btn-s" style="padding:0 4px" data-act="logDelEx" data-id="${id}" aria-label="Übung entfernen">×</button></span>`;
        }).join("")}</div>`:`<p style="font-size:.85rem;color:var(--muted);margin-top:6px">Noch keine Übung vermerkt.</p>`}
      </div>
    </div>

    <div class="card" style="margin-top:16px">
      <div class="row" style="justify-content:space-between;align-items:flex-start">
        <div><h3>Anwesenheitsliste</h3>
          <p style="font-size:.87rem;color:var(--ink-2);margin-top:3px">${base} von ${pl.length} Spielern eingetragen · Quote ${pct(counts.da, base)} %</p></div>
        <div class="row">
          <button class="btn btn-s" data-act="attAll" data-id="da">alle anwesend</button>
          <button class="btn btn-s btn-q" data-act="attAll" data-id="un">alle offen</button>
        </div>
      </div>
      ${pl.length?`<div class="att-list" style="margin-top:12px">${pl.map(function(p){
        const cur = L.att[p.id]||"";
        return `<div class="att-r">
          <div class="att-n">${esc(p.name)}<small>${esc(p.born||"")}${p.pos?" · "+esc(p.pos):""}</small></div>
          <div class="att-btns">${ATT.map(function(a){
            return `<button type="button" data-st="${a.id}" aria-pressed="${cur===a.id}" data-act="att" data-id="${p.id}" data-v="${a.id}" title="${esc(a.n)}">${a.s}</button>`;
          }).join("")}</div></div>`;
      }).join("")}</div>
      <div class="legend" style="margin-top:8px">${ATT.map(function(a){ return `<span><i style="background:${a.c}"></i>${a.s} = ${a.n}</span>`; }).join("")}</div>`
      :`<p style="margin-top:10px;color:var(--muted)">Der Kader ist leer. Trage unter <b>Teams &amp; Kader</b> Spieler ein.</p>`}
    </div>

    <div class="card" style="margin-top:16px">
      <label class="field"><span>Kommentar zur Einheit</span>
        <textarea data-ch="logKomm" placeholder="Was lief gut, was nehmen wir mit? Besondere Vorfälle, Verletzungen, Erkenntnisse …">${esc(L.komm)}</textarea>
        <span class="hint">Erscheint in der Analyse als Chronik und in der Übersicht.</span></label>
      <div class="row" style="margin-top:14px">
        <button class="btn btn-p" data-act="saveLog">Einheit speichern</button>
        ${L.existed?`<button class="btn btn-q btn-d" data-act="delLog">Einheit löschen</button>`:""}
      </div>
    </div>

    ${sessions.length?`<section class="section" style="margin-top:30px">
      <div class="section-h"><h2>Erfasste Einheiten</h2><p>${sessions.length} Einträge für ${esc(t.name)}.</p></div>
      <div class="tbl-wrap"><table><thead><tr><th>Datum</th><th>Art</th><th>Themen</th><th class="n">Anwesend</th><th class="n">Quote</th><th>Kommentar</th><th></th></tr></thead><tbody>
      ${sessions.slice(0,14).map(function(e){
        const c = attCounts(e);
        return `<tr><td>${esc(fmtShort(e.date))} ${esc(String(parseISO(e.date).getFullYear()))}</td><td>${esc(e.art||"Training")}</td>
          <td class="wrap-ok">${esc((e.themes||[]).map(themeName).join(", "))}</td>
          <td class="n">${c.da}/${c.total}</td><td class="n">${pct(c.da,c.total)} %</td>
          <td class="wrap-ok" style="max-width:280px;white-space:normal;color:var(--ink-2)">${esc((e.komm||"").slice(0,90))}${(e.komm||"").length>90?"…":""}</td>
          <td><button class="btn btn-s btn-q" data-act="logDate" data-id="${t.id}" data-d="${e.date}">bearbeiten</button></td></tr>`;
      }).join("")}</tbody></table></div>
    </section>`:""}
  </section>`;
}
</script>

<script>
"use strict";
/* ---------- Zeitraum-Steuerung ---------- */
const PERKINDS = [ {id:"monat",n:"Monat"}, {id:"halbjahr",n:"Halbjahr"}, {id:"jahr",n:"Jahr"}, {id:"gesamt",n:"Gesamt"} ];
function periodControls(state, sessions, chName){
  const opts = periodOptions(sessions, state.kind);
  if(state.kind!=="gesamt" && (!state.val || !opts.some(function(o){ return o.v===state.val; }))) state.val = opts.length?opts[0].v:null;
  return `<div class="row" style="margin-bottom:14px">
    <div class="seg">${PERKINDS.map(function(k){
      return `<button data-act="${chName}Kind" data-id="${k.id}" aria-pressed="${state.kind===k.id}">${k.n}</button>`;
    }).join("")}</div>
    ${state.kind!=="gesamt"?`<select data-ch="${chName}Val" style="max-width:220px">${opts.map(function(o){
      return `<option value="${o.v}"${state.val===o.v?" selected":""}>${esc(o.n)}</option>`; }).join("")}</select>`:""}
    <span style="font-size:.84rem;color:var(--muted)">${state.kind==="gesamt"?"alle erfassten Einheiten":"Zeitraum wählen"}</span>
  </div>`;
}
function periodLabel(state, sessions){
  if(state.kind==="gesamt") return "gesamter Zeitraum";
  const o = periodOptions(sessions, state.kind).filter(function(x){ return x.v===state.val; })[0];
  return o?o.n:"kein Zeitraum";
}

/* ---------- Ansicht: Analyse ---------- */
function vAna(){
  const t = curTeam();
  if(!t) return noTeam("Die Analyse baut auf den erfassten Einheiten eines Teams auf.");
  const all = Store.sessions(t.id);
  if(!all.length) return `<div class="empty"><h3>Noch keine Einheit erfasst</h3>
    <p>Erfasse die erste Einheit mit Anwesenheitsliste und Thema – danach entstehen hier automatisch alle Grafiken.</p>
    <button class="btn btn-p" data-act="logTeam" data-id="${t.id}">Training erfassen</button></div>`;
  const sessions = all.filter(function(e){ return inPeriod(e.date, S.per.kind, S.per.val); });
  const st = statsFor(sessions, t.players||[]);
  const months = uniq(sessions.map(function(e){ return monthKey(e.date); })).sort();
  const themeRows = THEMES.map(function(th){
    return { id:th.id, n:th.n, v:st.themes[th.id]||0, tipLabel:"Einheiten",
             sub: st.units? pct(st.themes[th.id]||0, st.units)+" % der Einheiten":"" };
  }).sort(function(a,b){ return b.v-a.v; });
  const missing = themeRows.filter(function(r){ return r.v===0; });
  const playerRows = Object.keys(st.players).map(function(pid){
    const p = st.players[pid];
    return { n:p.name, v:pct(p.da, p.base), tipLabel:"Anwesenheitsquote",
             sub: p.da+" von "+p.base+" Einheiten anwesend · "+p.ent+"× entschuldigt, "+p.ver+"× verletzt/krank, "+p.un+"× unentschuldigt" };
  }).filter(function(r){ return r.n; }).sort(function(a,b){ return b.v-a.v; });
  const covered = themeRows.filter(function(r){ return r.v>0; }).length;

  return `<section class="section">
    ${periodControls(S.per, all, "per")}
    <div class="tiles">
      <div class="tile"><span class="k">Einheiten</span><span class="v">${st.units}</span><span class="s">${esc(periodLabel(S.per, all))}</span></div>
      <div class="tile"><span class="k">Ø Anwesenheit</span><span class="v">${st.base?st.quote:"–"}<span style="font-size:1rem"> %</span></span><span class="s">${st.da} von ${st.base} Meldungen</span></div>
      <div class="tile"><span class="k">Trainingszeit</span><span class="v">${Math.round(st.minutes/60)}<span style="font-size:1rem"> h</span></span><span class="s">${st.minutes} Minuten</span></div>
      <div class="tile"><span class="k">Themen abgedeckt</span><span class="v">${covered}<span style="font-size:1rem">/${THEMES.length}</span></span><span class="s">${missing.length} offen</span></div>
      <div class="tile"><span class="k">Kader</span><span class="v">${(t.players||[]).length}</span><span class="s">${playerRows.length} mit Einträgen</span></div>
    </div>
  </section>

  <section class="section">
    <div class="section-h"><h2>Anwesenheit</h2><p>Jede Säule ist eine Einheit; die Farbe zeigt den Status der Spieler.</p></div>
    <div class="stack">
      <div class="chart">
        <div class="chart-h"><h3>Anwesenheit je Einheit</h3><span class="sub">${esc(periodLabel(S.per, all))}</span>
          <span class="tools"><button class="btn btn-s btn-q" data-act="tableView">${S.tableView?"Grafik zeigen":"Als Tabelle"}</button></span></div>
        ${S.tableView ? `<div class="tbl-wrap"><table><thead><tr><th>Datum</th><th>Themen</th>${ATT.map(function(a){ return `<th class="n">${a.n}</th>`; }).join("")}<th class="n">Quote</th></tr></thead><tbody>
          ${sessions.slice().reverse().map(function(e){ const c=attCounts(e);
            return `<tr><td>${esc(fmtShort(e.date))}</td><td class="wrap-ok">${esc((e.themes||[]).map(themeName).join(", "))}</td>
              <td class="n">${c.da}</td><td class="n">${c.ent}</td><td class="n">${c.ver}</td><td class="n">${c.un}</td><td class="n">${pct(c.da,c.total)} %</td></tr>`;
          }).join("")}</tbody></table></div>`
        : chartAttendance(sessions)+ATT_LEGEND}
      </div>
      ${sessions.length>1?`<div class="chart">
        <div class="chart-h"><h3>Anwesenheitsquote im Verlauf</h3><span class="sub">Anteil anwesender Spieler je Einheit in Prozent</span></div>
        ${chartQuote(sessions)}
      </div>`:""}
      <div class="chart">
        <div class="chart-h"><h3>Anwesenheitsquote je Spieler</h3><span class="sub">sortiert – Grundlage sind nur Einheiten mit Eintrag</span></div>
        ${barRows(playerRows, " %", 100)}
      </div>
    </div>
  </section>

  <section class="section">
    <div class="section-h"><h2>Trainingsthemen</h2><p>Wie oft wurde welches Thema im Zeitraum behandelt?</p></div>
    <div class="stack">
      <div class="chart">
        <div class="chart-h"><h3>Themenverteilung</h3><span class="sub">${st.units} Einheiten · Mehrfachthemen je Einheit möglich</span></div>
        ${barRows(themeRows.filter(function(r){ return r.v>0; }), "")}
        ${missing.length?`<div class="note" style="margin-top:14px"><b>Nicht behandelt (${missing.length}):</b> ${esc(missing.map(function(m){ return m.n; }).join(" · "))}</div>`:
          `<div class="note note-a" style="margin-top:14px">Alle ${THEMES.length} Themen wurden in diesem Zeitraum mindestens einmal trainiert.</div>`}
      </div>
      ${months.length>1?`<div class="chart">
        <div class="chart-h"><h3>Themenabdeckung im Zeitverlauf</h3><span class="sub">Einheiten je Thema und Monat</span></div>
        ${heatTable(THEMES.filter(function(th){ return (st.themes[th.id]||0)>0; }).map(function(th){ return th.id; }), months,
          function(r,c){ return (st.byMonth[c]&&st.byMonth[c][r])||0; }, themeName, monthLabel)}
      </div>`:""}
    </div>
  </section>

  ${st.comments.length?`<section class="section">
    <div class="section-h"><h2>Kommentar-Chronik</h2><p>${st.comments.length} Notizen im Zeitraum.</p></div>
    <div class="stack">${st.comments.map(function(c){
      return `<div class="card" style="padding:12px 14px">
        <div style="font-size:.78rem;color:var(--muted);font-weight:700">${esc(fmtDate(c.date))} · ${esc(c.themes.map(themeName).join(" / "))}</div>
        <p style="margin-top:4px;font-size:.92rem">${esc(c.komm)}</p></div>`;
    }).join("")}</div></section>`:""}`;
}

/* ---------- Ansicht: Übungsbibliothek ---------- */
function exCard(e){
  return `<article class="ex">
    <div class="ex-dia">${svgDia(e.dia)}</div>
    <div class="ex-b">
      <div class="ex-t"><h3>${esc(e.t)}</h3><span class="badge badge-a">${esc(TH[e.th].k)}</span></div>
      <div class="ex-m"><span>${esc(themeName(e.th))}</span><span>${e.min} Min.</span><span>${esc(e.pl)} Spieler</span><span>${esc(e.ages.join("/"))}</span></div>
      <p class="ex-goal">${esc(e.ziel)}</p>
      <div class="ex-foot"><button class="btn btn-s" data-act="ex" data-id="${e.id}">Erklärung &amp; Ablauf</button></div>
    </div></article>`;
}
function vLib(){
  const f = S.ex;
  let list = EXERCISES.filter(function(e){
    if(f.th && e.th!==f.th) return false;
    if(f.age && e.ages.indexOf(f.age)<0) return false;
    if(f.q){
      const q = f.q.toLowerCase();
      const hay = (e.t+" "+e.ziel+" "+e.ab.join(" ")+" "+e.co.join(" ")+" "+themeName(e.th)+" "+e.mat).toLowerCase();
      if(hay.indexOf(q)<0) return false;
    }
    return true;
  });
  const t = curTeam();
  return `<section class="section">
    <div class="card">
      <div class="grid-2" style="align-items:end">
        <label class="field"><span>Suche</span><input type="text" id="libQ" value="${esc(f.q)}" placeholder="Titel, Ziel, Coachingpunkt …" data-ch="libQ"></label>
        <label class="field"><span>Altersklasse</span>
          <select data-ch="libAge"><option value="">alle Altersklassen</option>
            ${AGES.map(function(a){ return `<option value="${a.id}"${f.age===a.id?" selected":""}>${esc(a.n)} · ${esc(a.u)}</option>`; }).join("")}
          </select></label>
      </div>
      <div class="field" style="margin-top:14px"><span>Thema</span>
        <div class="row">
          <button class="chip" aria-pressed="${!f.th}" data-act="libTheme" data-id="">alle</button>
          ${THEMES.map(function(th){
            const n = EXERCISES.filter(function(e){ return e.th===th.id; }).length;
            return `<button class="chip" aria-pressed="${f.th===th.id}" data-act="libTheme" data-id="${th.id}">${esc(th.n)} <span style="opacity:.65">${n}</span></button>`;
          }).join("")}
        </div>
      </div>
      <div class="row" style="margin-top:12px;justify-content:space-between">
        <span style="font-size:.88rem;color:var(--ink-2)"><b>${list.length}</b> von ${EXERCISES.length} Übungen${t?` · Filter für <b>${esc(ageLabel(t.age))}</b> setzen:`:""}
          ${t?`<button class="btn btn-s btn-q" data-act="libAgeTeam" data-id="${t.age}">${esc(t.age)}-Filter</button>`:""}</span>
        <button class="btn btn-s btn-q" data-act="libReset">Filter zurücksetzen</button>
      </div>
      ${DIA_LEGEND}
    </div>
  </section>
  ${list.length?`<div class="ex-grid">${list.map(exCard).join("")}</div>`
    :`<div class="empty"><h3>Keine Übung gefunden</h3><p>Andere Suchbegriffe oder weniger Filter probieren.</p>
      <button class="btn" data-act="libReset">Filter zurücksetzen</button></div>`}`;
}
function exDialog(e){
  return `<div class="dlg-h">
      <div><span class="eyebrow">${esc(themeName(e.th))}</span><h2 id="dlgTitle" style="margin-top:2px">${esc(e.t)}</h2></div>
      <button class="btn btn-s btn-q dlg-x" data-act="dlgClose" aria-label="Schließen">Schließen</button>
    </div>
    <div class="dlg-b">
      <div>
        <div class="ex-dia" style="border:1px solid var(--line);border-radius:var(--r)">${svgDia(e.dia)}</div>
        ${DIA_LEGEND}
      </div>
      <div class="tiles">
        <div class="tile"><span class="k">Dauer</span><span class="v">${e.min}<span style="font-size:1rem"> Min</span></span></div>
        <div class="tile"><span class="k">Spieler</span><span class="v" style="font-size:1.4rem">${esc(e.pl)}</span></div>
        <div class="tile"><span class="k">Altersklassen</span><span class="v" style="font-size:1.2rem">${esc(e.ages.join(" · "))}</span></div>
      </div>
      <div><h4>Ziel</h4><p style="color:var(--ink-2);margin-top:4px">${esc(e.ziel)}</p></div>
      <div><h4>Ablauf</h4><ol class="ol" style="margin-top:6px">${e.ab.map(function(x){ return "<li>"+esc(x)+"</li>"; }).join("")}</ol></div>
      <div><h4>Coachingpunkte</h4><ul class="ul-c" style="margin-top:6px">${e.co.map(function(x){ return "<li>"+esc(x)+"</li>"; }).join("")}</ul></div>
      <div><h4>Variationen</h4><ul class="ul-c" style="margin-top:6px">${e.va.map(function(x){ return "<li>"+esc(x)+"</li>"; }).join("")}</ul></div>
      <div><h4>Material</h4><p style="color:var(--ink-2);margin-top:4px">${esc(e.mat)}</p></div>
      <div class="note"><b>Altersgerecht anpassen:</b> ${esc(AG[e.ages[0]].tip)}</div>
    </div>`;
}

/* ---------- Ansicht: Vereinsübersicht ---------- */
function vClub(){
  const teams = Store.teams, allS = Store.allSessions();
  if(!teams.length) return noTeam("Sobald Teams angelegt sind, entsteht hier die Gesamtübersicht über alle Trainer.");
  const sessions = allS.filter(function(e){ return inPeriod(e.date, S.club.kind, S.club.val); });
  const trainerIds = uniq(teams.map(function(t){ return t.trainerId; }));
  const rows = teams.map(function(t){
    const s = sessions.filter(function(e){ return e.teamId===t.id; });
    const st = statsFor(s, t.players||[]);
    const allT = Store.sessions(t.id);
    return { t:t, st:st, last: allT.length?allT[allT.length-1].date:null,
             covered: Object.keys(st.themes).length };
  }).sort(function(a,b){ return b.st.units-a.st.units; });
  const totals = statsFor(sessions, []);
  const players = teams.reduce(function(a,t){ return a+((t.players||[]).length); },0);
  const themeAll = {};
  sessions.forEach(function(e){ (e.themes||[]).forEach(function(th){ themeAll[th]=(themeAll[th]||0)+1; }); });

  return `<section class="section">
    ${periodControls(S.club, allS, "club")}
    <div class="tiles">
      <div class="tile"><span class="k">Teams</span><span class="v">${teams.length}</span><span class="s">${trainerIds.length} Trainer</span></div>
      <div class="tile"><span class="k">Einheiten</span><span class="v">${totals.units}</span><span class="s">${esc(periodLabel(S.club, allS))}</span></div>
      <div class="tile"><span class="k">Ø Anwesenheit</span><span class="v">${totals.base?totals.quote:"–"}<span style="font-size:1rem"> %</span></span><span class="s">über alle Teams</span></div>
      <div class="tile"><span class="k">Trainingszeit</span><span class="v">${Math.round(totals.minutes/60)}<span style="font-size:1rem"> h</span></span><span class="s">Summe</span></div>
      <div class="tile"><span class="k">Spieler</span><span class="v">${players}</span><span class="s">in allen Kadern</span></div>
    </div>
  </section>

  <section class="section">
    <div class="section-h"><h2>Teams im Vergleich</h2><p>Zeitraum: ${esc(periodLabel(S.club, allS))}.</p></div>
    <div class="tbl-wrap">
      <table><thead><tr><th>Team</th><th>Altersklasse</th><th>Trainer</th><th class="n">Einheiten</th><th class="n">Ø Anwesenheit</th><th class="n">Themen</th><th class="n">Kader</th><th>Letzte Einheit</th></tr></thead><tbody>
      ${rows.map(function(r){
        return `<tr><td class="wrap-ok"><b>${esc(r.t.name)}</b>${r.t.trainerId===Store.me.id?' <span class="badge badge-a">mein Team</span>':""}</td>
          <td>${esc(ageShort(r.t.age))}</td><td>${esc(trainerName(r.t.trainerId))}</td>
          <td class="n">${r.st.units}</td><td class="n">${r.st.base?r.st.quote+" %":"–"}</td>
          <td class="n">${r.covered}/${THEMES.length}</td><td class="n">${(r.t.players||[]).length}</td>
          <td>${r.last?esc(fmtDate(r.last)):"–"}</td></tr>`;
      }).join("")}</tbody></table>
    </div>
  </section>

  <section class="section">
    <div class="section-h"><h2>Auswertung über alle Teams</h2></div>
    <div class="stack">
      <div class="chart">
        <div class="chart-h"><h3>Einheiten je Team</h3><span class="sub">${esc(periodLabel(S.club, allS))}</span></div>
        ${barRows(rows.map(function(r){ return { n:r.t.name, v:r.st.units, tipLabel:"Einheiten", sub:ageLabel(r.t.age)+" · "+trainerName(r.t.trainerId) }; }), "")}
      </div>
      <div class="chart">
        <div class="chart-h"><h3>Ø Anwesenheitsquote je Team</h3><span class="sub">nur Teams mit erfassten Einheiten</span></div>
        ${barRows(rows.filter(function(r){ return r.st.base>0; }).sort(function(a,b){ return b.st.quote-a.st.quote; })
          .map(function(r){ return { n:r.t.name, v:r.st.quote, tipLabel:"Anwesenheitsquote", sub:r.st.da+" von "+r.st.base+" Meldungen" }; }), " %", 100)}
      </div>
      <div class="chart">
        <div class="chart-h"><h3>Themenverteilung im Verein</h3><span class="sub">Einheiten je Thema, alle Teams zusammen</span></div>
        ${barRows(THEMES.map(function(th){ return { n:th.n, v:themeAll[th.id]||0, tipLabel:"Einheiten" }; })
          .filter(function(r){ return r.v>0; }).sort(function(a,b){ return b.v-a.v; }), "")}
      </div>
      <div class="chart">
        <div class="chart-h"><h3>Themenabdeckung je Team</h3><span class="sub">Zeigt Lücken in der Ausbildung – Zahl = Einheiten</span></div>
        ${heatTable(rows.map(function(r){ return r.t.id; }), THEMES.map(function(th){ return th.id; }),
          function(teamId, thId){ const r = rows.filter(function(x){ return x.t.id===teamId; })[0]; return (r&&r.st.themes[thId])||0; },
          function(id){ const t=Store.team(id); return t?t.name:id; },
          function(id){ return TH[id]?TH[id].n.split(" ")[0]:id; })}
      </div>
    </div>
    <div class="note" style="margin-top:16px"><b>Sichtbarkeit:</b> Alle Personen, die den Link zu dieser App haben, sehen diese Gesamtübersicht –
    es gibt keine Rollen oder Passwörter. Wer nur seine eigenen Zahlen sehen soll, arbeitet in einer eigenen Kopie der App und schickt dir bei Bedarf einen Export.</div>
  </section>`;
}

/* ---------- Ansicht: Teilen & Export ---------- */
function vShare(){
  const cloud = Store.mode==="cloud";
  const teams = Store.teams, sessions = Store.allSessions();
  return `<section class="section">
    <div class="card" style="border-left:3px solid var(--accent)">
      <span class="eyebrow">Speicherort</span>
      <h2 style="margin:4px 0 8px">${cloud?"Gemeinsame Vereinsdatenbank":"Nur dieses Gerät"}</h2>
      <p style="color:var(--ink-2);max-width:68ch">${cloud
        ? "Diese App speichert Teams, Pläne und Anwesenheitslisten in einer gemeinsamen Datenbank. Jede Person, die den Link öffnet, arbeitet auf demselben Datenbestand – neue Einheiten erscheinen bei allen anderen automatisch. Die Vereinsübersicht zeigt dir deshalb jederzeit alle Teams."
        : "Diese Ansicht läuft ohne Vereinsdatenbank – alle Daten liegen ausschließlich im lokalen Speicher dieses Browsers. Sie werden nicht geteilt und verschwinden, wenn die Browserdaten gelöscht werden. Sichere deine Daten regelmäßig über den Export."}</p>
      <div class="tiles" style="margin-top:14px">
        <div class="tile"><span class="k">Teams</span><span class="v">${teams.length}</span></div>
        <div class="tile"><span class="k">Einheiten</span><span class="v">${sessions.length}</span></div>
        <div class="tile"><span class="k">Trainer</span><span class="v">${Math.max(1,Object.keys(Store.trainers).length)}</span></div>
        <div class="tile"><span class="k">Modus</span><span class="v" style="font-size:1.3rem">${cloud?"geteilt":"lokal"}</span></div>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="section-h"><h2>Dein Trainerprofil</h2><p>Der Name kennzeichnet deine Teams und Kommentare in der Vereinsübersicht.</p></div>
    <div class="card">
      <div class="grid-2" style="align-items:end;max-width:620px">
        <label class="field"><span>Name</span><input type="text" value="${esc(Store.me.name)}" placeholder="z. B. Erol G." data-ch="meName"></label>
        <div><button class="btn" data-act="saveMe">Name speichern</button></div>
      </div>
      <p style="font-size:.85rem;color:var(--muted);margin-top:10px">Kennung: <span class="num">${esc(Store.me.id)}</span> – wird auf diesem Gerät gespeichert. Auf einem anderen Gerät oder Browser entsteht eine neue Kennung; deine Teams erkennst du dann über den Teamnamen.</p>
    </div>
  </section>

  <section class="section">
    <div class="section-h"><h2>App weitergeben</h2></div>
    <div class="card">
      <ol class="ol" style="font-size:.95rem">
        <li><b>Gemeinsam nutzen:</b> Teile den Link dieser App mit deinen Trainerkollegen. Jeder legt sein eigenes Team an; du siehst alle Teams in der Vereinsübersicht.</li>
        <li><b>Getrennt nutzen:</b> Wer seine Daten für sich behalten möchte, nutzt eine eigene Kopie der App. Für deine Gesamtübersicht schickt er dir einen Export, den du hier importierst.</li>
        <li><b>Sicherung:</b> Exportiere regelmäßig eine JSON-Datei – damit lässt sich der komplette Datenbestand wiederherstellen.</li>
      </ol>
    </div>
  </section>

  <section class="section">
    <div class="section-h"><h2>Export</h2><p>JSON für die vollständige Sicherung, CSV für Auswertungen in Excel.</p></div>
    <div class="card">
      <div class="row">
        <button class="btn btn-p" data-act="expJson">Alle Daten als JSON</button>
        <button class="btn" data-act="expCsv">Einheiten als CSV</button>
        <button class="btn" data-act="expPlayers">Anwesenheit je Spieler als CSV</button>
      </div>
      <p style="font-size:.85rem;color:var(--muted);margin-top:10px">Falls der Browser den Download nicht anbietet, erscheint der Inhalt in einem Textfeld zum Kopieren.</p>
      <div id="expOut"></div>
    </div>
  </section>

  <section class="section">
    <div class="section-h"><h2>Import</h2><p>Export einer anderen Person einlesen – vorhandene Teams mit gleicher Kennung werden überschrieben.</p></div>
    <div class="card">
      <div class="row">
        <input type="file" id="impFile" accept="application/json,.json" style="max-width:320px">
        <button class="btn" data-act="impFile">Datei importieren</button>
      </div>
      <details style="margin-top:14px">
        <summary style="cursor:pointer;font-weight:600;font-size:.9rem">JSON stattdessen einfügen</summary>
        <label class="field" style="margin-top:8px"><span>JSON-Inhalt</span><textarea id="impPaste" placeholder='{"app":"Anpfiff Trainerplaner", …}'></textarea></label>
        <button class="btn btn-s" data-act="impPaste" style="margin-top:8px">Eingefügte Daten importieren</button>
      </details>
    </div>
  </section>

  <section class="section">
    <div class="section-h"><h2>Was du wissen solltest</h2></div>
    <div class="stack">
      <div class="note"><b>Keine Rechteverwaltung.</b> Wer den Link hat, kann alle Teams sehen und bearbeiten – auch löschen. Die App eignet sich für ein Trainerteam, das sich vertraut, nicht für getrennte Mandanten.</div>
      <div class="note"><b>Gleichzeitiges Bearbeiten.</b> Bearbeiten zwei Personen dieselbe Einheit im selben Moment, gewinnt der letzte Speichervorgang. In der Praxis unkritisch, weil jedes Team eigene Einheiten führt.</div>
      <div class="note"><b>Personenbezogene Daten.</b> Kadernamen sind personenbezogen. Trage nur ein, was du eintragen darfst (Einverständnis der Eltern bzw. Spieler) und exportiere Daten nur an Berechtigte.</div>
      <div class="note"><b>Grafiken.</b> Alle Aufbauskizzen sind in der App selbst gezeichnet – es werden keine externen Bilder geladen. Deshalb funktioniert die App auch ohne Zugriff auf fremde Server.</div>
    </div>
  </section>`;
}
</script>

<script>
"use strict";
/* ---------- 6d) Rendern ---------- */
let refocus = null, pendingRender = false;
function render(){
  const nav = document.getElementById("nav"), navM = document.getElementById("navMob");
  nav.innerHTML = `<div class="nav-h eyebrow">Trainerbereich</div>`
    + NAV.slice(0,6).map(navBtn).join("")
    + `<div class="nav-h eyebrow">Verein</div>`
    + NAV.slice(6).map(navBtn).join("");
  navM.innerHTML = NAV.map(function(n){
    return `<button data-act="nav" data-id="${n.id}"${S.view===n.id?' aria-current="page"':""}>${esc(n.n)}</button>`;
  }).join("");

  const t = curTeam(), vt = VIEWTITLE[S.view] || ["Trainerplaner",""];
  const needsTeam = ["plan","log","ana"].indexOf(S.view)>=0;
  document.getElementById("topbar").innerHTML = `
    <div class="tb-title"><h1>${esc(vt[0])}</h1><span class="tb-meta">${esc(vt[1])}</span></div>
    <div class="tb-right">
      ${needsTeam && Store.teams.length ? `<label class="row" style="gap:6px"><span class="eyebrow">Team</span>
        <select data-ch="teamSel" style="max-width:230px">${Store.teams.map(function(x){
          return `<option value="${x.id}"${t&&t.id===x.id?" selected":""}>${esc(x.name)} · ${esc(x.age)}${x.trainerId!==Store.me.id?" ("+esc(trainerName(x.trainerId))+")":""}</option>`;
        }).join("")}</select></label>` : ""}
      ${t && needsTeam ? `<span class="badge">${esc(ageShort(t.age))}</span>` : ""}
    </div>`;

  const v = document.getElementById("view");
  const fn = { start:vStart, teams:vTeams, plan:vPlan, log:vLog, ana:vAna, lib:vLib, club:vClub, share:vShare }[S.view] || vStart;
  try{ v.innerHTML = fn(); }
  catch(err){ console.error(err); v.innerHTML = `<div class="empty"><h3>Diese Ansicht konnte nicht aufgebaut werden</h3><p>${esc(err.message)}</p></div>`; }

  document.getElementById("storeState").innerHTML = Store.mode==="cloud"
    ? '<span class="badge badge-a">Vereinsdatenbank</span> geteilt &amp; live'
    : '<span class="badge">Lokal</span> nur dieses Gerät';
  document.getElementById("meState").textContent = Store.me.name ? ("Angemeldet als "+Store.me.name) : "Kein Trainername gesetzt";

  if(refocus){
    const el = document.getElementById(refocus);
    if(el){ el.focus(); if(el.setSelectionRange){ const n=el.value.length; try{ el.setSelectionRange(n,n); }catch(e){} } }
    refocus = null;
  }
}
function navBtn(n){
  return `<button class="nav-i" data-act="nav" data-id="${n.id}"${S.view===n.id?' aria-current="page"':""}>
    <svg viewBox="0 0 24 24" aria-hidden="true">${n.i}</svg>${esc(n.n)}</button>`;
}
function renderSoft(){
  const a = document.activeElement;
  if(a && ["INPUT","TEXTAREA","SELECT"].indexOf(a.tagName)>=0){ pendingRender = true; return; }
  render();
}
document.addEventListener("focusout", function(){
  if(pendingRender){ pendingRender = false; setTimeout(renderSoft, 80); }
}, true);

/* ---------- Dialog ---------- */
function openDlg(html){
  const d = document.getElementById("dlg");
  document.getElementById("dlgInner").innerHTML = html;
  if(!d.open) d.showModal();
}
function closeDlg(){ const d=document.getElementById("dlg"); if(d.open) d.close(); }
function confirmDlg(title, text, label, fn){
  openDlg(`<div class="dlg-h"><div><h2 id="dlgTitle">${esc(title)}</h2></div></div>
    <div class="dlg-b"><p>${esc(text)}</p>
      <div class="row"><button class="btn btn-p btn-d" data-act="dlgYes">${esc(label)}</button>
      <button class="btn btn-q" data-act="dlgClose">Abbrechen</button></div></div>`);
  confirmDlg._fn = fn;
}

/* ---------- CSV / Export ---------- */
function csvCell(v){
  const s = String(v==null?"":v);
  return /[;"\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function csv(rows){ return "﻿"+rows.map(function(r){ return r.map(csvCell).join(";"); }).join("\r\n"); }
async function saveFile(filename, data){
  let dl = null;
  try{ if(window.claude && claude.use) dl = await claude.use("downloads"); }catch(e){ dl = null; }
  if(dl){
    try{ await dl.save({ filename:filename, data:data }); toast("Datei gespeichert: "+filename); return; }
    catch(e){
      if(e && e.code==="declined"){ toast("Download abgebrochen."); return; }
      if(e && e.code==="rate_limited"){ toast("Bitte einen Moment warten und erneut versuchen."); return; }
    }
  }
  const out = document.getElementById("expOut");
  if(out){
    out.innerHTML = `<label class="field" style="margin-top:14px"><span>${esc(filename)} – Inhalt markieren und kopieren</span>
      <textarea id="expTxt" style="min-height:160px;font-family:monospace;font-size:.8rem"></textarea></label>`;
    const ta = document.getElementById("expTxt");
    ta.value = data; ta.select();
    toast("Download hier nicht möglich – Inhalt zum Kopieren eingefügt.");
  }else toast("Export in dieser Ansicht nicht möglich.");
}
function sessionsCsv(){
  const rows = [["Team","Altersklasse","Trainer","Datum","Art","Dauer (Min)","Themen","Anwesend","Entschuldigt","Verletzt/krank","Unentschuldigt","Quote (%)","Kommentar"]];
  Store.allSessions().forEach(function(e){
    const t = Store.team(e.teamId); if(!t) return;
    const c = attCounts(e);
    rows.push([t.name, ageLabel(t.age), trainerName(t.trainerId), e.date, e.art||"Training", e.dauer||"",
      (e.themes||[]).map(themeName).join(" | "), c.da, c.ent, c.ver, c.un, pct(c.da,c.total), e.komm||""]);
  });
  return csv(rows);
}
function playersCsv(){
  const rows = [["Team","Spieler","Jahrgang","Position","Einheiten erfasst","Anwesend","Quote (%)","Entschuldigt","Verletzt/krank","Unentschuldigt"]];
  Store.teams.forEach(function(t){
    const st = statsFor(Store.sessions(t.id), t.players||[]);
    Object.keys(st.players).forEach(function(pid){
      const p = st.players[pid], src = (t.players||[]).filter(function(x){ return x.id===pid; })[0] || {};
      rows.push([t.name, p.name, src.born||"", src.pos||"", p.base, p.da, pct(p.da,p.base), p.ent, p.ver, p.un]);
    });
  });
  return csv(rows);
}
function planCsvText(plan, team){
  const rows = [["Team","Planart","Woche","Von","Bis","Phase","Schwerpunkt","Nebenthema","Belastung","Datum","Baustein","Minuten","Thema","Übung"]];
  plan.weeks.forEach(function(w){
    if(!(w.units||[]).length){
      rows.push([team.name, PT[plan.type].n, w.nr, w.from, w.to, w.phase, themeName(w.main), themeName(w.second), w.load, "", "", "", "", ""]);
      return;
    }
    w.units.forEach(function(u){
      u.blocks.forEach(function(b){
        const ex = EXMAP[b.ex];
        rows.push([team.name, PT[plan.type].n, w.nr, w.from, w.to, w.phase, themeName(w.main), themeName(w.second), w.load,
                   u.date, b.ph, b.min, themeName(b.th), ex?ex.t:""]);
      });
    });
  });
  return csv(rows);
}

/* ---------- Aktionen ---------- */
const ACT = {
  nav: function(p){ go(p.id); },
  /* Teams */
  newTeam: function(){ S.view="teams"; S.teamForm = { name:"", club:"", age:"E", season:"", dauer:AG.E.min, matchDay:-1, days:[2,4], players:[] }; uiSave(); render(); },
  editTeam: function(p){ const t=Store.team(p.id); if(!t) return; S.view="teams"; S.teamForm = JSON.parse(JSON.stringify(t)); uiSave(); render(); },
  cancelTeam: function(){ S.teamForm=null; render(); },
  tfDay: function(p){
    const i = +p.i, d = S.teamForm.days || [];
    const k = d.indexOf(i); if(k<0) d.push(i); else d.splice(k,1);
    S.teamForm.days = d.sort(function(a,b){return a-b;}); render();
  },
  tfAddPlayer: function(){
    const n = (document.getElementById("npName").value||"").trim();
    if(!n){ toast("Bitte einen Namen eingeben."); return; }
    S.teamForm.players = S.teamForm.players || [];
    S.teamForm.players.push({ id:uid("p"), name:n, born:document.getElementById("npBorn").value||"", pos:document.getElementById("npPos").value||"" });
    render();
  },
  tfDelPlayer: function(p){ S.teamForm.players.splice(+p.i,1); render(); },
  tfBulk: function(){
    const raw = (document.getElementById("bulkPlayers").value||"").split(/\r?\n/);
    S.teamForm.players = S.teamForm.players || [];
    let n = 0;
    raw.forEach(function(line){
      const s = line.trim(); if(!s) return;
      const parts = s.split(";").map(function(x){ return x.trim(); });
      if(!parts[0]) return;
      S.teamForm.players.push({ id:uid("p"), name:parts[0], born:parts[1]||"", pos:parts[2]||"" }); n++;
    });
    toast(n+" Spieler übernommen."); render();
  },
  saveTeam: async function(){
    const f = S.teamForm;
    if(!f.name || !f.name.trim()){ toast("Bitte einen Teamnamen eingeben."); return; }
    if(!f.id){ f.id = uid("team"); f.trainerId = Store.me.id; f.created = new Date().toISOString(); }
    if(!f.trainerId) f.trainerId = Store.me.id;
    f.trainerName = Store.me.name || "";
    try{ await Store.saveTeam(f); S.teamId = f.id; S.teamForm = null; S.log = null; toast("Team gespeichert."); uiSave(); render(); }
    catch(e){ toast("Speichern fehlgeschlagen: "+(e.message||e.code||"unbekannt")); }
  },
  delTeam: function(p){
    const t = Store.team(p.id); if(!t) return;
    confirmDlg("Team löschen?", "„"+t.name+"“ wird mit allen erfassten Einheiten, Kommentaren und dem gespeicherten Plan entfernt. Das lässt sich nicht rückgängig machen.",
      "Endgültig löschen", async function(){
        try{ await Store.deleteTeam(t.id); if(S.teamId===t.id) S.teamId=null; S.log=null; toast("Team gelöscht."); render(); }
        catch(e){ toast("Löschen fehlgeschlagen."); }
      });
  },
  logTeam: function(p){ S.log=null; go("log", p.id); },
  planTeam: function(p){ S.draft=null; go("plan", p.id); },
  anaTeam: function(p){ go("ana", p.id); },
  /* Plan */
  planType: function(p){ S.planType = p.id; S.draft = null; render(); },
  genPlan: function(){
    const t = curTeam(); if(!t) return;
    S.draft = generatePlan(t, S.planType, S.planStart);
    toast("Vorschlag erzeugt – noch nicht gespeichert."); render();
  },
  savePlan: async function(){
    const t = curTeam(); if(!t || !S.draft) return;
    try{ await Store.savePlan(t.id, S.draft); S.draft = null; toast("Plan gespeichert."); render(); }
    catch(e){ toast("Speichern fehlgeschlagen: "+(e.message||e.code||"unbekannt")); }
  },
  planCsv: function(){
    const t = curTeam(), plan = S.draft || Store.plan(t.id); if(!plan) return;
    saveFile("trainingsplan-"+t.name.replace(/[^a-zA-Z0-9]+/g,"-").toLowerCase()+".csv", planCsvText(plan, t));
  },
  /* Erfassen */
  logDate: function(p){
    const t = Store.team(p.id) || curTeam();
    S.teamId = t.id; S.log = null; S.view = "log";
    initLog(t, p.d); S.log.teamId = t.id; uiSave(); render();
    window.scrollTo({top:0,behavior:"instant"});
  },
  logTheme: function(p){
    const k = S.log.themes.indexOf(p.id);
    if(k<0) S.log.themes.push(p.id); else S.log.themes.splice(k,1);
    render();
  },
  logAddEx: function(){
    const sel = document.getElementById("exPick"); if(!sel || !sel.value) { toast("Bitte zuerst eine Übung auswählen."); return; }
    if(S.log.exIds.indexOf(sel.value)<0) S.log.exIds.push(sel.value);
    const e = EXMAP[sel.value];
    if(e && S.log.themes.indexOf(e.th)<0) S.log.themes.push(e.th);
    render();
  },
  logDelEx: function(p){ S.log.exIds = S.log.exIds.filter(function(x){ return x!==p.id; }); render(); },
  att: function(p){ S.log.att[p.id] = p.v; render(); },
  attAll: function(p){
    const t = curTeam();
    (t.players||[]).forEach(function(pl){ S.log.att[pl.id] = p.id==="un" ? "" : p.id; });
    if(p.id==="un"){ S.log.att = {}; }
    render();
  },
  saveLog: async function(){
    const t = curTeam(); if(!t) return;
    const L = S.log;
    if(!L.themes.length){ toast("Bitte mindestens ein Trainingsthema wählen."); return; }
    const att = {};
    Object.keys(L.att).forEach(function(k){ if(L.att[k]) att[k]=L.att[k]; });
    const entry = { date:L.date, dauer:+L.dauer||t.dauer, art:L.art, themes:L.themes.slice(),
                    exIds:L.exIds.slice(), att:att, komm:(L.komm||"").trim(), ts:new Date().toISOString(), by:Store.me.id };
    try{
      await Store.saveSession(t.id, entry);
      toast("Einheit gespeichert.");
      S.log = null; initLog(t, L.date); S.log.teamId = t.id; render();
    }catch(e){ toast("Speichern fehlgeschlagen: "+(e.message||e.code||"unbekannt")); }
  },
  delLog: function(){
    const t = curTeam(), d = S.log.date;
    confirmDlg("Einheit löschen?", "Die Einheit vom "+fmtDate(d)+" inklusive Anwesenheitsliste und Kommentar wird entfernt.", "Löschen", async function(){
      try{ await Store.deleteSession(t.id, d); S.log=null; initLog(t,d); S.log.teamId=t.id; toast("Einheit gelöscht."); render(); }
      catch(e){ toast("Löschen fehlgeschlagen."); }
    });
  },
  /* Analyse */
  perKind: function(p){ S.per.kind = p.id; S.per.val = null; render(); },
  clubKind: function(p){ S.club.kind = p.id; S.club.val = null; render(); },
  tableView: function(){ S.tableView = !S.tableView; render(); },
  /* Bibliothek */
  ex: function(p){ const e = EXMAP[p.id]; if(e) openDlg(exDialog(e)); },
  libTheme: function(p){ S.ex.th = p.id||""; render(); },
  libAgeTeam: function(p){ S.ex.age = p.id; render(); },
  libReset: function(){ S.ex = { th:"", age:"", q:"" }; render(); },
  /* Dialog */
  dlgClose: function(){ closeDlg(); },
  dlgYes: function(){ const f = confirmDlg._fn; closeDlg(); if(f) f(); },
  /* Teilen */
  saveMe: function(){ Store.saveMe(Store.me.name||""); toast("Name gespeichert."); },
  expJson: function(){ saveFile("anpfiff-trainerplaner-"+iso(new Date())+".json", JSON.stringify(Store.exportAll(), null, 2)); },
  expCsv: function(){ saveFile("einheiten-"+iso(new Date())+".csv", sessionsCsv()); },
  expPlayers: function(){ saveFile("anwesenheit-spieler-"+iso(new Date())+".csv", playersCsv()); },
  impFile: function(){
    const inp = document.getElementById("impFile");
    if(!inp.files || !inp.files[0]){ toast("Bitte zuerst eine Datei auswählen."); return; }
    const fr = new FileReader();
    fr.onload = async function(){
      try{ await Store.importAll(JSON.parse(fr.result), true); toast("Import abgeschlossen."); render(); }
      catch(e){ toast("Import fehlgeschlagen: "+(e.message||"ungültige Datei")); }
    };
    fr.readAsText(inp.files[0]);
  },
  impPaste: async function(){
    const ta = document.getElementById("impPaste");
    try{ await Store.importAll(JSON.parse(ta.value), true); toast("Import abgeschlossen."); render(); }
    catch(e){ toast("Import fehlgeschlagen: "+(e.message||"ungültiger Inhalt")); }
  }
};
const CH = {
  meName: function(v){ Store.me.name = v; Store.saveMe(v); },
  teamSel: function(v){ S.teamId = v; S.log = null; S.draft = null; uiSave(); render(); },
  planStart: function(v){ if(v) S.planStart = v; },
  logDate: function(v){ if(!v) return; const t=curTeam(); S.log=null; initLog(t, v); S.log.teamId=t.id; render(); },
  logDauer: function(v){ S.log.dauer = +v||S.log.dauer; },
  logArt: function(v){ S.log.art = v; },
  logKomm: function(v){ S.log.komm = v; },
  perVal: function(v){ S.per.val = v; render(); },
  clubVal: function(v){ S.club.val = v; render(); },
  libAge: function(v){ S.ex.age = v; render(); },
  libQ: function(v){ S.ex.q = v; refocus = "libQ"; render(); }
};
function params(el){
  return { id: el.getAttribute("data-id"), i: el.getAttribute("data-i"), v: el.getAttribute("data-v"), d: el.getAttribute("data-d") };
}
document.addEventListener("click", function(ev){
  const el = ev.target.closest ? ev.target.closest("[data-act]") : null;
  if(!el) return;
  const a = el.getAttribute("data-act");
  if(ACT[a]){ ev.preventDefault(); ACT[a](params(el)); }
});
document.addEventListener("change", function(ev){
  const el = ev.target;
  if(el.hasAttribute && el.hasAttribute("data-ch")){ const k = el.getAttribute("data-ch"); if(CH[k]) CH[k](el.value); }
  if(el.hasAttribute && el.hasAttribute("data-tf") && S.teamForm){
    const k = el.getAttribute("data-tf");
    let v = el.value;
    if(k==="dauer") v = +v||AG[S.teamForm.age].min;
    if(k==="matchDay") v = +v;
    S.teamForm[k] = v;
    if(k==="age"){ S.teamForm.dauer = AG[v].min; render(); }
  }
});
document.addEventListener("input", function(ev){
  const el = ev.target;
  if(!el.hasAttribute) return;
  if(el.hasAttribute("data-tf") && S.teamForm){
    const k = el.getAttribute("data-tf");
    if(k!=="age" && k!=="matchDay") S.teamForm[k] = (k==="dauer") ? (+el.value||S.teamForm.dauer) : el.value;
  }
  if(el.hasAttribute("data-ch")){
    const k = el.getAttribute("data-ch");
    if(k==="libQ"){ S.ex.q = el.value; refocus = "libQ"; render(); }
    else if(k==="logKomm") S.log.komm = el.value;
    else if(k==="meName") Store.me.name = el.value;
  }
});
document.getElementById("dlg").addEventListener("click", function(ev){
  if(ev.target.id==="dlg") closeDlg();
});

/* ---------- Start ---------- */
Store.loadMe();
tipInit();
render();
Store.onChange(renderSoft);
Store.init();
</script>

<title>Anpfiff Trainerplaner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme: light;
  --ground:#EEF1EA; --surface:#FCFDFA; --surface-2:#F3F6EF; --surface-3:#E8EDE2;
  --ink:#131A14; --ink-2:#47554C; --muted:#7A887F;
  --line:#DBE2D5; --line-strong:#C2CCBA;
  --accent:#0B6E4F; --accent-2:#0E8A62; --accent-ink:#FFFFFF; --accent-soft:#E2EFE8;
  --chalk:#B87400; --chalk-soft:#FBEFD6;
  --grass:#E6EEE3; --grass-line:#B9C9B4;
  --teamA:#1F5FA8; --teamB:#B23A2C; --teamN:#8A6A00;
  --c-good:#0ca30c; --c-warn:#fab219; --c-serious:#ec835a; --c-crit:#d03b3b;
  --viz-bar:#2a78d6; --viz-bar-2:#86b6ef;
  --s1:#cde2fb; --s2:#9ec5f4; --s3:#6da7ec; --s4:#3987e5; --s5:#256abf; --s6:#104281;
  --grid:#E1E4DC; --axis:#7A887F;
  --shadow: 0 1px 2px rgba(19,26,20,.05), 0 8px 24px -18px rgba(19,26,20,.28);
  --r:10px; --r-s:6px;
  --f-disp:"Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body:"Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --ground:#0D120F; --surface:#151C18; --surface-2:#1B2320; --surface-3:#222C27;
    --ink:#E9EEE7; --ink-2:#AFBCB2; --muted:#87968C;
    --line:#28322B; --line-strong:#3A463D;
    --accent:#3FBF83; --accent-2:#63D39C; --accent-ink:#07130D; --accent-soft:#16301F;
    --chalk:#FFC244; --chalk-soft:#33270C;
    --grass:#18231C; --grass-line:#31473A;
    --teamA:#6FA8E8; --teamB:#E88170; --teamN:#E3B34A;
    --viz-bar:#3987e5; --viz-bar-2:#1c5cab;
    --s1:#16263A; --s2:#184f95; --s3:#256abf; --s4:#3987e5; --s5:#86b6ef; --s6:#cde2fb;
    --grid:#242E28; --axis:#87968C;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px -20px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --ground:#0D120F; --surface:#151C18; --surface-2:#1B2320; --surface-3:#222C27;
  --ink:#E9EEE7; --ink-2:#AFBCB2; --muted:#87968C;
  --line:#28322B; --line-strong:#3A463D;
  --accent:#3FBF83; --accent-2:#63D39C; --accent-ink:#07130D; --accent-soft:#16301F;
  --chalk:#FFC244; --chalk-soft:#33270C;
  --grass:#18231C; --grass-line:#31473A;
  --teamA:#6FA8E8; --teamB:#E88170; --teamN:#E3B34A;
  --viz-bar:#3987e5; --viz-bar-2:#1c5cab;
  --s1:#16263A; --s2:#184f95; --s3:#256abf; --s4:#3987e5; --s5:#86b6ef; --s6:#cde2fb;
  --grid:#242E28; --axis:#87968C;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px -20px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-disp);font-weight:700;letter-spacing:.005em;margin:0;text-wrap:balance;line-height:1.12}
h1{font-size:1.9rem}h2{font-size:1.4rem}h3{font-size:1.12rem}h4{font-size:1rem}
p{margin:0}
a{color:var(--accent);text-underline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.eyebrow{font-family:var(--f-body);font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.mono-n{font-family:var(--f-disp);font-variant-numeric:tabular-nums;font-weight:600}

/* ---------- App shell ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;padding:16px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px}
.brand-mark{width:32px;height:32px;flex:0 0 auto}
.brand-txt{font-family:var(--f-disp);font-weight:700;font-size:1.18rem;line-height:1;letter-spacing:.01em}
.brand-sub{font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.nav-h{padding:14px 8px 6px}
.nav-i{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-s);border:0;background:none;text-align:left;cursor:pointer;color:var(--ink-2);font-weight:600;font-size:.94rem;width:100%;position:relative}
.nav-i:hover{background:var(--surface-2);color:var(--ink)}
.nav-i[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.nav-i[aria-current="page"]::before{content:"";position:absolute;left:-12px;top:6px;bottom:6px;width:3px;border-radius:0 2px 2px 0;background:var(--chalk)}
.nav-i svg{width:17px;height:17px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.side-foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--line);font-size:.8rem;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:var(--ground);border-bottom:1px solid var(--line);padding:12px 26px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.topbar .tb-title{display:flex;flex-direction:column;gap:1px;min-width:0}
.topbar h1{font-size:1.35rem}
.tb-meta{font-size:.82rem;color:var(--muted)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.view{padding:22px 26px 64px;max-width:1180px;width:100%}
.section{margin-bottom:34px}
.section-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.section-h p{font-size:.88rem;color:var(--ink-2);max-width:62ch}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ---------- Controls ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:var(--r-s);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-weight:600;font-size:.9rem;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-p:hover{background:var(--accent-2);border-color:var(--accent-2);color:var(--accent-ink)}
.btn-s{padding:5px 10px;font-size:.82rem}
.btn-q{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn-q:hover{background:var(--surface-2);color:var(--ink);border-color:transparent}
.btn-d:hover{border-color:var(--c-crit);color:var(--c-crit)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:.76rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.field .hint{font-size:.78rem;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:400}
input[type=text],input[type=date],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-s);padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical;min-height:78px;line-height:1.5}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.grid-3{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:100px;border:1px solid var(--line-strong);background:var(--surface);font-size:.84rem;font-weight:600;cursor:pointer;color:var(--ink-2)}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:100px;background:var(--surface-3);color:var(--ink-2);font-size:.74rem;font-weight:700;letter-spacing:.03em;white-space:nowrap}
.badge-a{background:var(--accent-soft);color:var(--accent)}
.badge-c{background:var(--chalk-soft);color:var(--chalk)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r-s);overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;font-size:.85rem;font-weight:600;cursor:pointer;color:var(--ink-2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.seg button:hover:not([aria-pressed="true"]){background:var(--surface-2)}

/* ---------- Surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tile{background:var(--surface);padding:13px 15px;display:flex;flex-direction:column;gap:2px}
.tile .k{font-size:.72rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-family:var(--f-disp);font-size:1.85rem;font-weight:700;line-height:1.05}
.tile .s{font-size:.78rem;color:var(--ink-2)}
.empty{border:1px dashed var(--line-strong);border-radius:var(--r);padding:26px;text-align:center;color:var(--ink-2);background:var(--surface-2)}
.empty h3{margin-bottom:6px}
.empty p{max-width:52ch;margin:0 auto 14px;font-size:.92rem}
.note{border-left:3px solid var(--chalk);background:var(--chalk-soft);padding:10px 14px;border-radius:0 var(--r-s) var(--r-s) 0;font-size:.88rem;color:var(--ink)}
.note-a{border-left-color:var(--accent);background:var(--accent-soft)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.wrap-ok{white-space:normal;min-width:190px}

/* ---------- Exercise cards ---------- */
.ex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.ex-dia{background:var(--grass);border-bottom:1px solid var(--line);padding:8px}
.ex-dia svg{display:block;width:100%;height:auto}
.ex-b{padding:13px 15px 15px;display:flex;flex-direction:column;gap:9px;flex:1}
.ex-t{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.ex-t h3{font-size:1.06rem}
.ex-m{display:flex;gap:10px;flex-wrap:wrap;font-size:.76rem;color:var(--muted);font-weight:600}
.ex-goal{font-size:.9rem;color:var(--ink-2)}
.ex-foot{margin-top:auto;display:flex;gap:8px;align-items:center;padding-top:4px}
.ol{margin:0;padding-left:1.15rem;font-size:.9rem;color:var(--ink-2)}
.ol li{margin-bottom:5px}
.ul-c{list-style:none;margin:0;padding:0;font-size:.9rem;color:var(--ink-2)}
.ul-c li{position:relative;padding-left:16px;margin-bottom:5px}
.ul-c li::before{content:"";position:absolute;left:2px;top:.55em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
dialog{border:1px solid var(--line-strong);border-radius:var(--r);padding:0;background:var(--surface);color:var(--ink);max-width:min(720px,94vw);width:100%;box-shadow:0 24px 60px -20px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(10,14,11,.55)}
.dlg-h{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.dlg-b{padding:16px;display:flex;flex-direction:column;gap:16px;max-height:min(72vh,740px);overflow-y:auto}
.dlg-x{margin-left:auto}

/* ---------- Plan ---------- */
.pl-week{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.pl-wh{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.pl-wh .w{font-family:var(--f-disp);font-weight:700;font-size:1.05rem}
.load{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
.load i{width:4px;background:var(--line-strong);border-radius:1px}
.load i.on{background:var(--accent)}
.pl-days{display:grid;gap:1px;background:var(--line)}
.pl-day{background:var(--surface);padding:11px 14px;display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px}
.pl-dd{font-size:.84rem;color:var(--muted);font-weight:700}
.pl-blocks{display:flex;flex-direction:column;gap:6px}
.pl-bl{display:grid;grid-template-columns:100px minmax(0,1fr);gap:10px;font-size:.9rem;align-items:baseline}
.pl-bl .ph{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
.pl-ex{background:none;border:0;padding:0;text-align:left;color:var(--ink);cursor:pointer;font-weight:600;font-size:.9rem;border-bottom:1px dashed var(--line-strong)}
.pl-ex:hover{color:var(--accent);border-bottom-color:var(--accent)}
.pl-macro{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.pl-mb{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:0 var(--r-s) var(--r-s) 0;background:var(--surface);padding:12px 14px}
.pl-mb h4{margin-bottom:3px}
.pl-mb .p{font-size:.75rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.pl-mb ul{margin:8px 0 0;padding-left:1.1rem;font-size:.87rem;color:var(--ink-2)}

/* ---------- Attendance ---------- */
.att-list{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.att-r{display:grid;grid-template-columns:minmax(110px,1fr) auto;gap:10px;align-items:center;background:var(--surface);padding:8px 12px}
.att-n{font-weight:600;min-width:0}
.att-n small{display:block;font-weight:400;color:var(--muted);font-size:.76rem}
.att-btns{display:flex;gap:4px;flex-wrap:wrap}
.att-btns button{border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r-s);padding:4px 9px;font-size:.78rem;font-weight:700;cursor:pointer;color:var(--ink-2)}
.att-btns button:hover{border-color:var(--ink-2)}
.att-btns button[aria-pressed="true"]{color:#fff;border-color:transparent}
.att-btns button[data-st="da"][aria-pressed="true"]{background:var(--c-good)}
.att-btns button[data-st="ent"][aria-pressed="true"]{background:var(--c-warn);color:#2b2100}
.att-btns button[data-st="ver"][aria-pressed="true"]{background:var(--c-serious);color:#2b1200}
.att-btns button[data-st="un"][aria-pressed="true"]{background:var(--c-crit)}

/* ---------- Charts ---------- */
.chart{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px}
.chart-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.chart-h h3{font-size:1.02rem}
.chart-h .sub{font-size:.82rem;color:var(--muted)}
.chart-h .tools{margin-left:auto}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--ink-2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block;flex:0 0 auto}
.ttip{position:fixed;z-index:60;pointer-events:none;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-s);padding:8px 10px;font-size:.82rem;box-shadow:var(--shadow);max-width:250px;opacity:0;transition:opacity .1s}
.ttip.on{opacity:1}
.ttip b{font-family:var(--f-disp);font-size:.95rem}
.ttip .tr{display:flex;justify-content:space-between;gap:14px}
.ttip .tr i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px}
.hm-wrap{overflow-x:auto}
.hm{border-collapse:separate;border-spacing:2px;width:auto}
.hm td,.hm th{border:0;padding:0}
.hm td.c{min-width:30px;height:24px;border-radius:3px;text-align:center;font-size:.72rem;font-variant-numeric:tabular-nums}
.hm th{background:none;text-transform:none;letter-spacing:0;font-size:.78rem;color:var(--ink-2);padding:2px 8px 2px 0;font-weight:600}
.hm th.col{font-size:.72rem;color:var(--muted);text-align:center;padding:0 0 4px}
.bar-row{display:grid;grid-template-columns:minmax(96px,170px) minmax(0,1fr) 58px;gap:10px;align-items:center;font-size:.88rem;padding:3px 0}
.bar-row .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.bar-track{background:var(--surface-3);border-radius:3px;height:14px;position:relative;overflow:hidden}
.bar-fill{position:absolute;left:0;top:0;bottom:0;background:var(--viz-bar);border-radius:0 4px 4px 0}
.bar-row .vl{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;font-family:var(--f-disp)}

/* ---------- Misc ---------- */
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:11px 15px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface-2);margin-bottom:18px;font-size:.9rem}
.banner .grow{flex:1;min-width:200px}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,14px);background:var(--ink);color:var(--ground);padding:10px 18px;border-radius:100px;font-weight:600;font-size:.9rem;z-index:80;opacity:0;transition:.18s;pointer-events:none;box-shadow:var(--shadow)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mob-nav{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .mob-nav{display:flex;gap:6px;overflow-x:auto;padding:9px 14px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
  .mob-nav button{flex:0 0 auto;border:1px solid var(--line-strong);background:var(--surface);border-radius:100px;padding:6px 13px;font-weight:600;font-size:.86rem;cursor:pointer;color:var(--ink-2)}
  .mob-nav button[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .topbar{padding:11px 15px;position:static}
  .view{padding:16px 15px 60px}
  .pl-day{grid-template-columns:1fr}
  .bar-row{grid-template-columns:minmax(80px,110px) minmax(0,1fr) 50px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<div class="app">
  <aside class="side">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="1.5" y="4.5" width="29" height="23" rx="2" fill="var(--grass)" stroke="var(--accent)" stroke-width="1.4"></rect>
        <path d="M16 4.5 V27.5" stroke="var(--grass-line)" stroke-width="1.1"></path>
        <circle cx="16" cy="16" r="4.6" fill="none" stroke="var(--grass-line)" stroke-width="1.1"></circle>
        <path d="M1.5 11.5 H6 V20.5 H1.5 M30.5 11.5 H26 V20.5 H30.5" fill="none" stroke="var(--grass-line)" stroke-width="1.1"></path>
        <circle cx="16" cy="16" r="2.1" fill="var(--chalk)"></circle>
      </svg>
      <div>
        <div class="brand-txt">Anpfiff</div>
        <div class="brand-sub">Trainerplaner</div>
      </div>
    </div>

const ageLabel = function(id){ return AG[id] ? AG[id].n + " (" + AG[id].u + ")" : id; };

const ATT = [

];
const DAYS = ["So","Mo","Di","Mi","Do","Fr","Sa"];
const MON = ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
const MONL = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];

/* ---------- Hilfsfunktionen ---------- */
const uid = function(p){ return (p||"id") + "-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,7); };
const esc = function(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); };
const iso = function(d){ const z=new Date(d.getTime()-d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); };
const parseISO = function(s){ const p=String(s).split("-"); return new Date(+p[0], +p[1]-1, +p[2]); };
const addDays = function(d,n){ const x=new Date(d.getTime()); x.setDate(x.getDate()+n); return x; };
const fmtDate = function(s){ const d=parseISO(s); return DAYS[d.getDay()]+", "+d.getDate()+". "+MON[d.getMonth()]+" "+d.getFullYear(); };
const fmtShort = function(s){ const d=parseISO(s); return d.getDate()+"."+(d.getMonth()+1)+"."; };
const monthKey = function(s){ return String(s).slice(0,7); };
const monthLabel = function(k){ const p=k.split("-"); return MONL[+p[1]-1]+" "+p[0]; };
const pct = function(a,b){ return b>0 ? Math.round(a/b*100) : 0; };
const clamp = function(v,a,b){ return Math.max(a, Math.min(b,v)); };
const uniq = function(a){ return a.filter(function(v,i){ return a.indexOf(v)===i; }); };

/* ---------- 2) Taktik-Grafiken ----------
   Jede Übung beschreibt ihre Grafik als kompakte Elementliste; dieser
   Renderer zeichnet daraus ein SVG (Feld, Spieler, Hütchen, Bälle, Wege).
   Koordinatensystem: 0..200 (x) / 0..130 (y).                          */
const D = {
  fullPitch: function(){
    return '<rect x="4" y="4" width="192" height="122" rx="2" fill="var(--grass)" stroke="var(--grass-line)" stroke-width="1.2"/>'
      + '<path d="M100 4 V126" stroke="var(--grass-line)" stroke-width="1"/>'
      + '<circle cx="100" cy="65" r="18" fill="none" stroke="var(--grass-line)" stroke-width="1"/>'
      + '<path d="M4 38 H26 V92 H4 M196 38 H174 V92 H196" fill="none" stroke="var(--grass-line)" stroke-width="1"/>';
  },
  halfPitch: function(){
    return '<rect x="4" y="4" width="192" height="122" rx="2" fill="var(--grass)" stroke="var(--grass-line)" stroke-width="1.2"/>'
      + '<path d="M4 4 H196" stroke="var(--grass-line)" stroke-width="1"/>'
      + '<path d="M150 4 H196 M150 4 V126 M150 30 H196 M150 100 H196" fill="none" stroke="var(--grass-line)" stroke-width="1" opacity=".8"/>'
      + '<circle cx="196" cy="65" r="22" fill="none" stroke="var(--grass-line)" stroke-width="1" opacity=".6"/>';
  },
  plain: function(){
    return '<rect x="4" y="4" width="192" height="122" rx="2" fill="var(--grass)" stroke="var(--grass-line)" stroke-width="1.2"/>';
  },
  grid: function(){
    return D.plain() + '<path d="M68 4 V126 M132 4 V126" stroke="var(--grass-line)" stroke-width="1" stroke-dasharray="4 4"/>';
  },
  goal: function(x,y,dir){
    const w=3.5, h=22;
    if(dir==="r") return '<rect x="'+x+'" y="'+(y-h/2)+'" width="'+w+'" height="'+h+'" fill="none" stroke="var(--ink-2)" stroke-width="1.6"/><path d="M'+x+' '+(y-h/2)+' L'+(x+w)+' '+(y+h/2)+' M'+x+' '+(y+h/2)+' L'+(x+w)+' '+(y-h/2)+'" stroke="var(--ink-2)" stroke-width=".5" opacity=".6"/>';
    if(dir==="l") return '<rect x="'+(x-w)+'" y="'+(y-h/2)+'" width="'+w+'" height="'+h+'" fill="none" stroke="var(--ink-2)" stroke-width="1.6"/><path d="M'+(x-w)+' '+(y-h/2)+' L'+x+' '+(y+h/2)+' M'+(x-w)+' '+(y+h/2)+' L'+x+' '+(y-h/2)+'" stroke="var(--ink-2)" stroke-width=".5" opacity=".6"/>';
    return '<rect x="'+(x-h/2)+'" y="'+y+'" width="'+h+'" height="'+w+'" fill="none" stroke="var(--ink-2)" stroke-width="1.6"/>';
  },
  mini: function(x,y,dir){
    const w=2.6, h=13;
    if(dir==="v") return '<rect x="'+(x-h/2)+'" y="'+(y-w/2)+'" width="'+h+'" height="'+w+'" fill="none" stroke="var(--ink-2)" stroke-width="1.5"/>';
    return '<rect x="'+(x-w/2)+'" y="'+(y-h/2)+'" width="'+w+'" height="'+h+'" fill="none" stroke="var(--ink-2)" stroke-width="1.5"/>';
  },
  cone: function(x,y){
    return '<path d="M'+x+' '+(y-5)+' L'+(x+4)+' '+(y+3.5)+' L'+(x-4)+' '+(y+3.5)+' Z" fill="var(--chalk)" stroke="none"/>';
  },
  pole: function(x,y){
    return '<path d="M'+x+' '+(y+5)+' V'+(y-7)+'" stroke="var(--chalk)" stroke-width="1.8"/><circle cx="'+x+'" cy="'+(y-8)+'" r="1.6" fill="var(--chalk)"/>';
  },
  ball: function(x,y){
    return '<circle cx="'+x+'" cy="'+y+'" r="2.9" fill="var(--surface)" stroke="var(--ink)" stroke-width="1"/>';
  },
  player: function(x,y,team,lb){
    const f = team==="B" ? "var(--teamB)" : team==="N" ? "var(--teamN)" : team==="K" ? "var(--ink-2)" : "var(--teamA)";
    return '<circle cx="'+x+'" cy="'+y+'" r="6.4" fill="'+f+'" stroke="var(--surface)" stroke-width="1.4"/>'
      + (lb ? '<text x="'+x+'" y="'+(y+2.6)+'" text-anchor="middle" font-family="Barlow Condensed, sans-serif" font-size="8.4" font-weight="700" fill="#fff">'+esc(lb)+'</text>' : "");
  },
  gk: function(x,y,lb){
    return '<rect x="'+(x-6)+'" y="'+(y-6)+'" width="12" height="12" rx="2.4" fill="var(--teamN)" stroke="var(--surface)" stroke-width="1.4"/>'
      + '<text x="'+x+'" y="'+(y+2.6)+'" text-anchor="middle" font-family="Barlow Condensed, sans-serif" font-size="8" font-weight="700" fill="#3b2c00">'+esc(lb||"TW")+'</text>';
  },
  head: function(x1,y1,x2,y2,col,sz){
    const a=Math.atan2(y2-y1,x2-x1), s=sz||4.2, w=0.42;
    const p=[ x2+" "+y2, (x2-s*Math.cos(a-w))+" "+(y2-s*Math.sin(a-w)), (x2-s*Math.cos(a+w))+" "+(y2-s*Math.sin(a+w)) ];
    return '<path d="M'+p.join(" L")+' Z" fill="'+col+'"/>';
  },
  shorten: function(x1,y1,x2,y2,by){
    const dx=x2-x1, dy=y2-y1, L=Math.sqrt(dx*dx+dy*dy)||1;
    return [x2 - dx/L*by, y2 - dy/L*by];
  },
  pass: function(x1,y1,x2,y2){
    const e=D.shorten(x1,y1,x2,y2,4);
    return '<path d="M'+x1+' '+y1+' L'+e[0]+' '+e[1]+'" stroke="var(--ink-2)" stroke-width="1.5" stroke-dasharray="5 3.5" fill="none"/>'+D.head(x1,y1,e[0],e[1],"var(--ink-2)");
  },
  run: function(x1,y1,x2,y2){
    const e=D.shorten(x1,y1,x2,y2,4);
    return '<path d="M'+x1+' '+y1+' L'+e[0]+' '+e[1]+'" stroke="var(--accent)" stroke-width="1.5" fill="none"/>'+D.head(x1,y1,e[0],e[1],"var(--accent)");
  },
  shot: function(x1,y1,x2,y2){
    const e=D.shorten(x1,y1,x2,y2,5);
    return '<path d="M'+x1+' '+y1+' L'+e[0]+' '+e[1]+'" stroke="var(--teamB)" stroke-width="2.4" fill="none"/>'+D.head(x1,y1,e[0],e[1],"var(--teamB)",5.4);
  },
  drib: function(x1,y1,x2,y2){
    const dx=x2-x1, dy=y2-y1, L=Math.sqrt(dx*dx+dy*dy)||1, ux=dx/L, uy=dy/L, px=-uy, py=ux;
    const seg=7, n=Math.max(2,Math.round((L-4)/seg)); let d="M"+x1+" "+y1;
    for(let i=1;i<=n;i++){
      const t0=(i-1)/n*(L-4), t1=i/n*(L-4), tm=(t0+t1)/2, amp=(i%2?1:-1)*2.4;
      d += " Q"+(x1+ux*tm+px*amp)+" "+(y1+uy*tm+py*amp)+" "+(x1+ux*t1)+" "+(y1+uy*t1);
    }
    const e=[x1+ux*(L-4), y1+uy*(L-4)];
    return '<path d="'+d+'" stroke="var(--ink)" stroke-width="1.4" fill="none"/>'+D.head(x1,y1,e[0],e[1],"var(--ink)");
  },
  zone: function(x,y,w,h,lb){
    return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="var(--accent)" fill-opacity=".07" stroke="var(--accent)" stroke-width="1" stroke-dasharray="4 3"/>'
      + (lb ? '<text x="'+(x+3)+'" y="'+(y+9)+'" font-family="Barlow Condensed, sans-serif" font-size="8" font-weight="600" fill="var(--accent)">'+esc(lb)+'</text>' : "");
  },
  txt: function(x,y,t,anchor){
    return '<text x="'+x+'" y="'+y+'" text-anchor="'+(anchor||"start")+'" font-family="Barlow Condensed, sans-serif" font-size="9" font-weight="600" fill="var(--ink-2)">'+esc(t)+'</text>';
  }
};
function svgDia(dia){
  if(!dia) return "";
  const bg = dia.bg==="full" ? D.fullPitch() : dia.bg==="half" ? D.halfPitch() : dia.bg==="grid" ? D.grid() : D.plain();
  let out = "";
  (dia.i||[]).forEach(function(it){
    const k = it[0], a = it;
    if(k==="goal") out += D.goal(a[1],a[2],a[3]||"r");
    else if(k==="mini") out += D.mini(a[1],a[2],a[3]);
    else if(k==="cone") out += D.cone(a[1],a[2]);
    else if(k==="pole") out += D.pole(a[1],a[2]);
    else if(k==="ball") out += D.ball(a[1],a[2]);
    else if(k==="p") out += D.player(a[1],a[2],a[3],a[4]);
    else if(k==="gk") out += D.gk(a[1],a[2],a[3]);
    else if(k==="pass") out += D.pass(a[1],a[2],a[3],a[4]);
    else if(k==="run") out += D.run(a[1],a[2],a[3],a[4]);
    else if(k==="shot") out += D.shot(a[1],a[2],a[3],a[4]);
    else if(k==="drib") out += D.drib(a[1],a[2],a[3],a[4]);
    else if(k==="zone") out += D.zone(a[1],a[2],a[3],a[4],a[5]);
    else if(k==="txt") out += D.txt(a[1],a[2],a[3],a[4]);
  });
  return '<svg viewBox="0 0 200 130" role="img" aria-label="Aufbauskizze der Übung">'+bg+out+'</svg>';
}
const DIA_LEGEND = '<div class="legend" style="margin-top:6px">'
  + '<span><svg width="26" height="10" aria-hidden="true"><path d="M1 5 H18" stroke="var(--ink-2)" stroke-width="1.5" stroke-dasharray="5 3.5"/><path d="M18 1.5 L25 5 L18 8.5 Z" fill="var(--ink-2)"/></svg> Pass</span>'
  + '<span><svg width="26" height="10" aria-hidden="true"><path d="M1 5 H18" stroke="var(--accent)" stroke-width="1.5"/><path d="M18 1.5 L25 5 L18 8.5 Z" fill="var(--accent)"/></svg> Laufweg</span>'
  + '<span><svg width="26" height="10" aria-hidden="true"><path d="M1 5 Q5 1 9 5 Q13 9 17 5" stroke="var(--ink)" stroke-width="1.4" fill="none"/><path d="M17 1.5 L24 5 L17 8.5 Z" fill="var(--ink)"/></svg> Dribbling</span>'
  + '<span><svg width="26" height="10" aria-hidden="true"><path d="M1 5 H17" stroke="var(--teamB)" stroke-width="2.4"/><path d="M17 1 L25 5 L17 9 Z" fill="var(--teamB)"/></svg> Torschuss</span>'
  + '<span><i style="background:var(--teamA);border-radius:50%"></i> Team A</span>'
  + '<span><i style="background:var(--teamB);border-radius:50%"></i> Team B / Gegner</span>'
  + '<span><i style="background:var(--teamN);border-radius:50%"></i> Neutral / Torwart</span>'
  + '<span><i style="background:var(--chalk);clip-path:polygon(50% 0,100% 100%,0 100%)"></i> Hütchen / Stange</span>'
  + '</div>';

<script>
"use strict";
/* ---------- 4) Planungslogik ---------- */
const PLANTYPES = [
  { id:"woche",    n:"Wochenplan",          w:1,  d:"Eine Trainingswoche mit Schwerpunkt je Einheit." },

];

const CYCLES = {

  taktik:      [["build","game"],["def","swit"],["swit","shot"],["build","set"]],

  feinschliff: [["set","swit"],["build","shot"],["def","set"],["game","team"]],
  spielen:     [["drib","game"],["pass","game"],["shot","game"],["warm","drib"]]
};
/* Welche Themen sind in welcher Altersklasse sinnvoll? */
function allowedThemes(age){
  const young = ["G","F"], mid = ["E"], old = ["C","B","A","H"];
  let block = [];
  if(young.indexOf(age)>=0) block = ["ath","head","set","build","swit","def","gk"];
  else if(mid.indexOf(age)>=0) block = ["ath","head","swit"];
  else if(age==="D") block = ["ath"];
  else if(age==="AH") block = ["head","swit"];
  return THEMES.map(function(t){ return t.id; }).filter(function(id){ return block.indexOf(id)<0; });
}
function fixTheme(th, age){
  const ok = allowedThemes(age);
  if(ok.indexOf(th)>=0) return th;
  const f = (AG[age]||AG.E).focus.filter(function(x){ return ok.indexOf(x)>=0; });
  return f[0] || "game";
}
function cycleFor(kind, age){
  const young = ["G","F","E"].indexOf(age)>=0;
  if(young && (kind==="grundlagen"||kind==="aufbau"||kind==="taktik")) kind = "spielen";
  return CYCLES[kind] || CYCLES.wettkampf;
}
function pickEx(theme, age, seed){
  let pool = EXERCISES.filter(function(e){ return e.th===theme && e.ages.indexOf(age)>=0; });
  if(!pool.length) pool = EXERCISES.filter(function(e){ return e.th===theme; });
  if(!pool.length) pool = EXERCISES.filter(function(e){ return e.ages.indexOf(age)>=0; });
  if(!pool.length) return null;
  return pool[Math.abs(seed) % pool.length];
}
/* Phasen je Planart */
function phasePlan(type, age){
  const young = ["G","F","E"].indexOf(age)>=0;
  if(type==="woche") return [{ n:"Trainingswoche", w:1, k: young?"spielen":"wettkampf", load:[3],
    ziel: young ? "Viele Ballkontakte, Spielfreude, ein technischer Schwerpunkt." : "Themenschwerpunkt der Woche mit Wettkampfbezug." }];
  if(type==="monat") return [
    { n:"Woche 1 – Grundlage",   w:1, k: young?"spielen":"technik",   load:[3], ziel:"Technischer Schwerpunkt, moderate Belastung." },
    { n:"Woche 2 – Steigerung",  w:1, k: young?"spielen":"wettkampf", load:[4], ziel:"Themen unter Gegnerdruck, Intensität erhöhen." },
    { n:"Woche 3 – Wettkampf",   w:1, k: young?"technik":"taktik",    load:[4], ziel:"Spielnahe Formen, Umsetzung im Abschlussspiel." },
    { n:"Woche 4 – Entlastung",  w:1, k: young?"spielen":"feinschliff", load:[2], ziel:"Regeneration, Standards, Spielfreude." }
  ];
  if(type==="halbjahr") return [
    { n:"Vorbereitung",          w:5, k: young?"spielen":"grundlagen", load:[3,4,4,5,3], ziel: young?"Ballgewöhnung und Spielformen nach der Pause.":"Grundlagen: Umfang vor Intensität, Athletik mit Ball." },
    { n:"Wettkampfphase I",      w:8, k:"wettkampf", load:[4,4,3,4,4,3,4,4], ziel:"Wochenrhythmus um den Spieltag, Themen rotierend." },
    { n:"Stabilisierung",        w:6, k: young?"technik":"taktik", load:[4,3,4,4,3,4], ziel:"Taktische Feinheiten, Standards, individuelle Schwächen." },
    { n:"Ausklang & Übergang",   w:3, k:"feinschliff", load:[3,2,2], ziel:"Belastung senken, Teamerlebnis, Saisonauswertung." }
  ];
  if(type==="jahr") return [
    { n:"Sommervorbereitung",    w:6,  k: young?"spielen":"grundlagen", load:[3,4,5,4,4,3], ziel: young?"Spielerischer Wiedereinstieg, Technikbasis.":"Grundlagenausdauer, Athletik, Spielsystem einführen." },
    { n:"Wettkampf Herbstrunde", w:15, k:"wettkampf", load:[4,4,3,4,4,3,4,4,3,4,4,3,4,4,3], ziel:"Wettkampfrhythmus halten, Themen im Vier-Wochen-Zyklus." },
    { n:"Winterpause / Halle",   w:5,  k:"halle", load:[2,3,3,3,2], ziel:"Technik in der Halle, Koordination, Spaßformen." },
    { n:"Wintervorbereitung",    w:6,  k: young?"technik":"aufbau", load:[3,4,5,4,4,3], ziel:"Athletik aufbauen, Taktik neu justieren, Testspiele." },
    { n:"Wettkampf Frühjahr",    w:13, k:"wettkampf", load:[4,4,3,4,4,3,4,4,3,4,4,3,4], ziel:"Formkurve halten, Standards und Umschaltspiel schärfen." },
    { n:"Saisonabschluss",       w:2,  k:"feinschliff", load:[3,2], ziel:"Auswertung, Teamerlebnis, Ausblick auf die neue Saison." }
  ];
  if(type==="sommer") return [
    { n:"Woche 1 – Grundlage",        w:1, k: young?"spielen":"grundlagen", load:[3], ziel:"Wiedereinstieg: Umfang moderat, viel Ballkontakt." },
    { n:"Woche 2 – Umfang",           w:1, k: young?"spielen":"grundlagen", load:[4], ziel:"Aerobe Grundlage mit Ball, Technik unter leichter Ermüdung." },
    { n:"Woche 3 – Intensität",       w:1, k: young?"technik":"aufbau", load:[5], ziel:"Intensive Spielformen, Umschalten, erste Testspiele." },
    { n:"Woche 4 – Taktik",           w:1, k: young?"technik":"taktik", load:[4], ziel:"Spielsystem, Grundordnung, Defensivverhalten." },
    { n:"Woche 5 – Wettkampfnähe",    w:1, k:"wettkampf", load:[4], ziel:"Spielnahe Formen, Standards, Testspiel unter Wettkampfbedingungen." },
    { n:"Woche 6 – Feinabstimmung",   w:1, k:"feinschliff", load:[3], ziel:"Belastung senken, Automatismen sichern, Saisonstart vorbereiten." }
  ];
  return [
    { n:"Woche 1 – Wiedereinstieg",   w:1, k:"halle", load:[2], ziel:"Beweglichkeit, Technik, Koordination nach der Pause." },
    { n:"Woche 2 – Technik & Halle",  w:1, k:"halle", load:[3], ziel:"Ballkontakte, Kleinfeldspiele, Stabilisation." },
    { n:"Woche 3 – Athletik",         w:1, k: young?"spielen":"grundlagen", load:[4], ziel:"Grundlagenausdauer und Kraftausdauer aufbauen." },
    { n:"Woche 4 – Athletik & Ball",  w:1, k: young?"spielen":"grundlagen", load:[4], ziel:"Intensive Läufe mit Ball, Schnelligkeit einbauen." },
    { n:"Woche 5 – Intensität",       w:1, k: young?"technik":"aufbau", load:[5], ziel:"Umschaltspiel, intensive Spielformen, erstes Testspiel." },
    { n:"Woche 6 – Taktik",           w:1, k: young?"technik":"taktik", load:[4], ziel:"Grundordnung, Pressing, Restverteidigung." },
    { n:"Woche 7 – Testspielwoche",   w:1, k:"wettkampf", load:[4], ziel:"Wettkampfnähe herstellen, Standards festlegen." },
    { n:"Woche 8 – Feinabstimmung",   w:1, k:"feinschliff", load:[3], ziel:"Belastung senken, Rückrundenstart vorbereiten." }
  ];
}
/* Bausteine einer Einheit auf die Gesamtdauer verteilen */
function blockPlan(dauer, main, second, age, seed){
  const warm = fixTheme("warm", age);
  const m1 = Math.max(15, Math.round(dauer*0.30/5)*5);
  const m2 = Math.max(10, Math.round(dauer*0.25/5)*5);
  const w  = Math.max(10, Math.round(dauer*0.20/5)*5);
  const end = Math.max(10, dauer - m1 - m2 - w);
  const blocks = [
    { ph:"Aufwärmen",   min:w,   th:warm,  ex:(pickEx(warm, age, seed)||{}).id },
    { ph:"Hauptteil 1", min:m1,  th:main,  ex:(pickEx(main, age, seed+3)||{}).id },
    { ph:"Hauptteil 2", min:m2,  th:second,ex:(pickEx(second, age, seed+7)||{}).id },
    { ph:"Schlussteil", min:end, th:fixTheme("game", age), ex:(pickEx("game", age, seed+11)||{}).id }
  ];
  return blocks;
}
function generatePlan(team, type, startISO){
  const age = team.age, dauer = team.dauer || (AG[age]?AG[age].min:75);
  const days = (team.days && team.days.length) ? team.days.slice().sort(function(a,b){return a-b;}) : [2,4];
  const phases = phasePlan(type, age);
  const detailWeeks = (type==="halbjahr"||type==="jahr"||type==="monat") ? (type==="monat"?4:4) : 99;
  const start = parseISO(startISO);
  const monday = addDays(start, -((start.getDay()+6)%7));
  const weeks = []; let wn = 0;
  phases.forEach(function(ph, pi){
    const cyc = cycleFor(ph.k, age);
    for(let i=0;i<ph.w;i++){
      const pair = cyc[wn % cyc.length];
      let main = fixTheme(pair[0], age), second = fixTheme(pair[1], age);
      if(main===second) second = fixTheme(cyc[(wn+1)%cyc.length][1], age);
      const wStart = addDays(monday, wn*7);
      const units = [];
      if(wn < detailWeeks){
        days.forEach(function(dow, di){
          const dt = addDays(wStart, (dow+6)%7);
          let uMain = main, uSecond = second, hint = "";
          const isLastBeforeMatch = team.matchDay>=0 && di===days.length-1;
          if(isLastBeforeMatch && ["C","B","A","H"].indexOf(age)>=0){
            uMain = "set"; uSecond = "swit";
            hint = "Spielvorbereitung: Standards, kurze Intensitäten, Belastung dosieren.";
          }
          units.push({ date: iso(dt), dauer: dauer, themes:[uMain, uSecond], hint: hint,
                       blocks: blockPlan(dauer, uMain, uSecond, age, wn*13+di*5+pi) });
        });
      }
      weeks.push({ nr: wn+1, phase: ph.n, ziel: ph.ziel, load: ph.load[i]!=null?ph.load[i]:3,
                   from: iso(wStart), to: iso(addDays(wStart,6)), main: main, second: second, units: units });
      wn++;
    }
  });
  return { type:type, teamId:team.id, start:startISO, created:new Date().toISOString(),
           age:age, phases:phases.map(function(p){ return {n:p.n, w:p.w, ziel:p.ziel}; }), weeks:weeks };
}

/* ---------- 5) Speicher ---------- */
const LS_DATA = "anpfiff.v1.data", LS_ME = "anpfiff.v1.me";
const Store = {
  mode:"lokal", db:null, subs:[], listeners:[],
  teams:[], months:{}, plans:{}, trainers:{},
  me:null, demo:false,

  lsRead: function(){
    try{ const raw = localStorage.getItem(LS_DATA); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
  },
  lsWrite: function(){
    if(this.mode!=="lokal") return;
    try{ localStorage.setItem(LS_DATA, JSON.stringify({teams:this.teams, months:this.months, plans:this.plans, trainers:this.trainers})); }
    catch(e){ toast("Lokaler Speicher voll – bitte Daten exportieren."); }
  },
  loadMe: function(){
    let m = null;
    try{ m = JSON.parse(localStorage.getItem(LS_ME)||"null"); }catch(e){ m = null; }
    if(!m || !m.id) m = { id: uid("tr"), name: "" };
    this.me = m; return m;
  },
  saveMe: function(name){
    this.me.name = name;
    try{ localStorage.setItem(LS_ME, JSON.stringify(this.me)); }catch(e){}
    this.trainers[this.me.id] = { name:name, ts:new Date().toISOString() };
    if(this.mode==="cloud" && this.db){ this.db.doc("trainers/"+this.me.id).set({ name:name, ts:new Date().toISOString() }).catch(nop); }
    else this.lsWrite();
    this.emit();
  },
  init: async function(){
    this.loadMe();
    let db = null;
    try{ if(window.claude && claude.use) db = await claude.use("db"); }catch(e){ db = null; }
    if(db){
      this.db = db; this.mode = "cloud";
      const self = this;
      const fail = function(e){ if(e && e.code==="revoked"){ self.mode="lokal"; self.emit(); } };
      db.collection("teams").onSnapshot(function(s){
        self.teams = s.docs.map(function(d){ const o=d.data()||{}; o.id=d.id; return o; });
        self.demo = false; self.emit();
      }, fail);
      db.collection("sessions").onSnapshot(function(s){
        const m = {}; s.docs.forEach(function(d){ const o=d.data()||{}; m[d.id]=o.e||[]; });
        self.months = m; self.emit();
      }, fail);
      db.collection("plans").onSnapshot(function(s){
        const p = {}; s.docs.forEach(function(d){ const o=d.data()||{}; if(o.plan) p[d.id]=o.plan; });
        self.plans = p; self.emit();
      }, fail);
      db.collection("trainers").onSnapshot(function(s){
        const t = {}; s.docs.forEach(function(d){ t[d.id]=d.data()||{}; });
        self.trainers = t; self.emit();
      }, fail);
    }else{
      const d = this.lsRead();
      if(d){ this.teams=d.teams||[]; this.months=d.months||{}; this.plans=d.plans||{}; this.trainers=d.trainers||{}; }
    }
    this.emit();
  },
  onChange: function(fn){ this.listeners.push(fn); },
  emit: function(){ this.listeners.forEach(function(f){ try{ f(); }catch(e){ console.error(e); } }); },

  /* --- Teams --- */
  saveTeam: async function(team){
    team.updated = new Date().toISOString();
    if(this.mode==="cloud"){
      const body = Object.assign({}, team); delete body.id;
      await this.db.doc("teams/"+team.id).set(body);
    }else{
      const i = this.teams.findIndex(function(t){ return t.id===team.id; });
      if(i<0) this.teams.push(team); else this.teams[i]=team;
      this.lsWrite(); this.emit();
    }
  },
  deleteTeam: async function(id){
    if(this.mode==="cloud"){
      await this.db.doc("teams/"+id).delete().catch(nop);
      const keys = Object.keys(this.months).filter(function(k){ return k.indexOf(id+"__")===0; });
      for(const k of keys){ await this.db.doc("sessions/"+k).delete().catch(nop); }
      await this.db.doc("plans/"+id).delete().catch(nop);
    }else{
      this.teams = this.teams.filter(function(t){ return t.id!==id; });
      Object.keys(this.months).forEach(function(k){ if(k.indexOf(id+"__")===0) delete Store.months[k]; });
      delete this.plans[id];
      this.lsWrite(); this.emit();
    }
  },
  team: function(id){ return this.teams.filter(function(t){ return t.id===id; })[0] || null; },
  myTeams: function(){
    const me = this.me.id, self = this;
    return this.teams.filter(function(t){ return t.trainerId===me || (t.coTrainers||[]).indexOf(me)>=0; });
  },

  /* --- Pläne --- */
  savePlan: async function(teamId, plan){
    if(this.mode==="cloud"){ await this.db.doc("plans/"+teamId).set({ plan: plan, ts:new Date().toISOString() }); }
    else{ this.plans[teamId]=plan; this.lsWrite(); this.emit(); }
  },
  plan: function(teamId){ return this.plans[teamId] || null; },

  /* --- Einheiten (pro Team und Monat in einem Dokument) --- */
  key: function(teamId, dateISO){ return teamId + "__" + monthKey(dateISO); },
  sessions: function(teamId){
    const out = [], self = this;
    Object.keys(this.months).forEach(function(k){
      if(k.indexOf(teamId+"__")!==0) return;
      (self.months[k]||[]).forEach(function(e){ out.push(e); });
    });
    return out.sort(function(a,b){ return a.date<b.date?-1:1; });
  },
  allSessions: function(){
    const out = [], self = this;
    Object.keys(this.months).forEach(function(k){
      const teamId = k.split("__")[0];
      (self.months[k]||[]).forEach(function(e){ out.push(Object.assign({ teamId:teamId }, e)); });
    });
    return out.sort(function(a,b){ return a.date<b.date?-1:1; });
  },
  saveSession: async function(teamId, entry){
    const k = this.key(teamId, entry.date);
    let list;
    if(this.mode==="cloud"){
      const snap = await this.db.doc("sessions/"+k).get();
      list = (snap.exists && snap.data().e) ? snap.data().e.slice() : [];
    }else{
      list = (this.months[k]||[]).slice();
    }
    const i = list.findIndex(function(e){ return e.date===entry.date; });
    if(i<0) list.push(entry); else list[i]=entry;
    list.sort(function(a,b){ return a.date<b.date?-1:1; });
    if(this.mode==="cloud"){
      await this.db.doc("sessions/"+k).set({ teamId:teamId, m:monthKey(entry.date), e:list, ts:new Date().toISOString() });
    }else{
      this.months[k]=list; this.lsWrite(); this.emit();
    }
  },
  deleteSession: async function(teamId, dateISO){
    const k = this.key(teamId, dateISO);
    let list;
    if(this.mode==="cloud"){
      const snap = await this.db.doc("sessions/"+k).get();
      list = (snap.exists && snap.data().e) ? snap.data().e.slice() : [];
    }else{ list = (this.months[k]||[]).slice(); }
    list = list.filter(function(e){ return e.date!==dateISO; });
    if(this.mode==="cloud"){
      if(list.length) await this.db.doc("sessions/"+k).set({ teamId:teamId, m:monthKey(dateISO), e:list, ts:new Date().toISOString() });
      else await this.db.doc("sessions/"+k).delete().catch(nop);
    }else{
      if(list.length) this.months[k]=list; else delete this.months[k];
      this.lsWrite(); this.emit();
    }
  },
  session: function(teamId, dateISO){
    const list = this.months[this.key(teamId, dateISO)] || [];
    return list.filter(function(e){ return e.date===dateISO; })[0] || null;
  },
  /* --- Import / Export --- */
  exportAll: function(){
    return { app:"Anpfiff Trainerplaner", version:1, exported:new Date().toISOString(),
             trainer:this.me, teams:this.teams, months:this.months, plans:this.plans, trainers:this.trainers };
  },
  importAll: async function(data, merge){
    if(!data || !data.teams) throw new Error("Datei enthält keine Teamdaten.");
    if(this.mode==="cloud"){
      for(const t of data.teams){ const b=Object.assign({}, t); delete b.id; await this.db.doc("teams/"+t.id).set(b); }
      for(const k of Object.keys(data.months||{})){
        const teamId = k.split("__")[0], m = k.split("__")[1];
        await this.db.doc("sessions/"+k).set({ teamId:teamId, m:m, e:data.months[k], ts:new Date().toISOString() });
      }
      for(const k of Object.keys(data.plans||{})){ await this.db.doc("plans/"+k).set({ plan:data.plans[k], ts:new Date().toISOString() }); }
      for(const k of Object.keys(data.trainers||{})){ await this.db.doc("trainers/"+k).set(data.trainers[k]); }
    }else{
      if(merge){
        const ids = this.teams.map(function(t){ return t.id; });
        data.teams.forEach(function(t){ if(ids.indexOf(t.id)<0) Store.teams.push(t); });
        Object.keys(data.months||{}).forEach(function(k){ Store.months[k]=data.months[k]; });
        Object.keys(data.plans||{}).forEach(function(k){ Store.plans[k]=data.plans[k]; });
        Object.keys(data.trainers||{}).forEach(function(k){ Store.trainers[k]=data.trainers[k]; });
      }else{
        this.teams = data.teams; this.months = data.months||{}; this.plans = data.plans||{}; this.trainers = data.trainers||{};
      }
      this.lsWrite(); this.emit();
    }
  }
};
function nop(){}
</script>

<script>
"use strict";
/* ---------- 6a) Auswertung: Kennzahlen ---------- */
function attCounts(e){
  const c = { da:0, ent:0, ver:0, un:0, total:0 };
  const a = e.att || {};
  Object.keys(a).forEach(function(pid){ const s=a[pid]; if(c[s]!=null){ c[s]++; c.total++; } });
  return c;
}
function periodOptions(sessions, kind){
  const months = uniq(sessions.map(function(s){ return monthKey(s.date); })).sort();
  if(kind==="monat"){
    return months.map(function(m){ return { v:m, n:monthLabel(m) }; }).reverse();
  }
  if(kind==="halbjahr"){
    const set = uniq(months.map(function(m){ const y=m.slice(0,4), h=(+m.slice(5,7)<=6)?1:2; return y+"-H"+h; })).sort();
    return set.map(function(v){ return { v:v, n:(v.slice(5)==="H1"?"1. Halbjahr ":"2. Halbjahr ")+v.slice(0,4) }; }).reverse();
  }
  if(kind==="jahr"){
    return uniq(months.map(function(m){ return m.slice(0,4); })).sort().reverse().map(function(y){ return { v:y, n:"Saisonjahr "+y }; });
  }
  return [{ v:"all", n:"Gesamter Zeitraum" }];
}
function inPeriod(dateISO, kind, val){
  if(kind==="gesamt" || !val || val==="all") return true;
  if(kind==="monat") return monthKey(dateISO)===val;
  if(kind==="jahr") return dateISO.slice(0,4)===val;
  if(kind==="halbjahr"){
    const y=val.slice(0,4), h=val.slice(5);
    if(dateISO.slice(0,4)!==y) return false;
    const m=+dateISO.slice(5,7);
    return h==="H1" ? m<=6 : m>6;
  }
  return true;
}
function statsFor(sessions, players){
  const st = { units:sessions.length, minutes:0, da:0, base:0, themes:{}, byMonth:{}, players:{}, comments:[] };
  (players||[]).forEach(function(p){ st.players[p.id] = { name:p.name, da:0, ent:0, ver:0, un:0, base:0 }; });
  sessions.forEach(function(e){
    st.minutes += (+e.dauer||0);
    const c = attCounts(e);
    st.da += c.da; st.base += c.total;
    (e.themes||[]).forEach(function(t){
      st.themes[t] = (st.themes[t]||0)+1;
      const mk = monthKey(e.date);
      st.byMonth[mk] = st.byMonth[mk] || {};
      st.byMonth[mk][t] = (st.byMonth[mk][t]||0)+1;
    });
    const a = e.att||{};
    Object.keys(a).forEach(function(pid){
      if(!st.players[pid]) st.players[pid] = { name:"(ehemaliger Spieler)", da:0, ent:0, ver:0, un:0, base:0 };
      const s=a[pid]; if(st.players[pid][s]!=null){ st.players[pid][s]++; st.players[pid].base++; }
    });
    if(e.komm) st.comments.push({ date:e.date, komm:e.komm, themes:e.themes||[] });
  });
  st.quote = pct(st.da, st.base);
  st.comments.reverse();
  return st;
}

/* ---------- 6b) Diagramme ---------- */
const TIP = { el:null };
function tipInit(){
  TIP.el = document.getElementById("ttip");
  document.addEventListener("mousemove", function(ev){
    const t = ev.target.closest ? ev.target.closest("[data-tip]") : null;
    if(!t){ TIP.el.classList.remove("on"); return; }
    TIP.el.innerHTML = t.getAttribute("data-tip");
    TIP.el.classList.add("on");
    const r = TIP.el.getBoundingClientRect();
    let x = ev.clientX + 14, y = ev.clientY - r.height - 10;
    if(x + r.width > window.innerWidth - 8) x = ev.clientX - r.width - 14;
    if(y < 8) y = ev.clientY + 16;
    TIP.el.style.left = x+"px"; TIP.el.style.top = y+"px";
  }, true);
  document.addEventListener("scroll", function(){ TIP.el.classList.remove("on"); }, true);
}
/* Anwesenheit je Einheit als gestapelte Säulen (Anzahl Spieler) */
function aggAttendance(sessions){
  if(sessions.length<=26){
    return { mode:"Einheit", items: sessions.map(function(e){
      const c = attCounts(e);
      return { label:fmtShort(e.date), full:fmtDate(e.date), c:c, themes:(e.themes||[]) };
    })};
  }
  const byM = {};
  sessions.forEach(function(e){
    const k = monthKey(e.date);
    byM[k] = byM[k] || { da:0,ent:0,ver:0,un:0,total:0,n:0 };
    const c = attCounts(e);
    byM[k].da+=c.da; byM[k].ent+=c.ent; byM[k].ver+=c.ver; byM[k].un+=c.un; byM[k].total+=c.total; byM[k].n++;
  });
  const keys = Object.keys(byM).sort();
  return { mode:"Monat", items: keys.map(function(k){
    const b=byM[k], n=b.n||1;
    return { label:MON[+k.slice(5,7)-1], full:monthLabel(k)+" · "+b.n+" Einheiten",
             c:{ da:Math.round(b.da/n), ent:Math.round(b.ent/n), ver:Math.round(b.ver/n), un:Math.round(b.un/n), total:Math.round(b.total/n) }, themes:[] };
  })};
}
function chartAttendance(sessions){
  const agg = aggAttendance(sessions), items = agg.items;
  if(!items.length) return '<div class="empty"><p>Noch keine Einheiten erfasst – die Grafik füllt sich mit der ersten Anwesenheitsliste.</p></div>';
  const W=720, H=228, PL=30, PR=6, PT=8, PB=30;
  const maxV = Math.max.apply(null, items.map(function(i){ return i.c.total; }).concat([1]));
  const top = Math.max(4, Math.ceil(maxV/2)*2);
  const iw = (W-PL-PR)/items.length, bw = Math.min(34, Math.max(4, iw-6));
  const sc = function(v){ return PT + (H-PT-PB) * (1 - v/top); };
  let g = "";
  [0, top/2, top].forEach(function(v){
    g += '<line x1="'+PL+'" y1="'+sc(v)+'" x2="'+(W-PR)+'" y2="'+sc(v)+'" stroke="var(--grid)" stroke-width="1"/>'
      + '<text x="'+(PL-6)+'" y="'+(sc(v)+3.5)+'" text-anchor="end" font-size="10" fill="var(--axis)">'+v+'</text>';
  });
  let bars = "";
  const ser = [["da","var(--c-good)"],["ent","var(--c-warn)"],["ver","var(--c-serious)"],["un","var(--c-crit)"]];
  items.forEach(function(it, idx){
    const x = PL + iw*idx + (iw-bw)/2;
    let yAcc = 0;
    const q = pct(it.c.da, it.c.total);
    let tip = "<b>"+esc(it.full)+"</b>";
    if(it.themes.length) tip += '<div style="color:var(--muted);margin-bottom:4px">'+esc(it.themes.map(themeName).join(" · "))+"</div>";
    tip += '<div class="tr"><span><i style="background:var(--c-good)"></i>Anwesend</span><b>'+it.c.da+"</b></div>";
    if(it.c.ent) tip += '<div class="tr"><span><i style="background:var(--c-warn)"></i>Entschuldigt</span><b>'+it.c.ent+"</b></div>";
    if(it.c.ver) tip += '<div class="tr"><span><i style="background:var(--c-serious)"></i>Verletzt/krank</span><b>'+it.c.ver+"</b></div>";
    if(it.c.un) tip += '<div class="tr"><span><i style="background:var(--c-crit)"></i>Unentschuldigt</span><b>'+it.c.un+"</b></div>";
    tip += '<div class="tr" style="border-top:1px solid var(--line);margin-top:4px;padding-top:4px"><span>Quote</span><b>'+q+" %</b></div>";
    ser.forEach(function(s){
      const v = it.c[s[0]]; if(!v) return;
      const h = (H-PT-PB) * v/top;
      const y = sc(yAcc) - h;
      bars += '<rect x="'+x.toFixed(1)+'" y="'+(y+1).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(1,h-2).toFixed(1)+'" rx="1.5" fill="'+s[1]+'"/>';
      yAcc += v;
    });
    bars += '<rect x="'+(PL+iw*idx).toFixed(1)+'" y="'+PT+'" width="'+iw.toFixed(1)+'" height="'+(H-PT-PB)+'" fill="transparent" data-tip="'+esc(tip).replace(/"/g,"&quot;")+'"/>';
    if(items.length<=18 || idx%2===0)
      bars += '<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-PB+14)+'" text-anchor="middle" font-size="9.5" fill="var(--axis)">'+esc(it.label)+"</text>";
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Anwesenheit je '+agg.mode+' als gestapelte Säulen">'
    + g + bars
    + '<text x="'+PL+'" y="'+(H-2)+'" font-size="9.5" fill="var(--axis)">'+(agg.mode==="Monat"?"Ø Spieler je Einheit, gruppiert nach Monat":"Spieler je Einheit")+"</text></svg>";
}
function chartQuote(sessions){
  const pts = sessions.map(function(e){ const c=attCounts(e); return { x:e.date, v:pct(c.da,c.total), n:c.total }; });
  if(pts.length<2) return "";
  const W=720, H=150, PL=30, PR=8, PT=10, PB=24;
  const sc = function(v){ return PT + (H-PT-PB)*(1 - v/100); };
  const xs = function(i){ return PL + (W-PL-PR) * (pts.length===1?0.5:i/(pts.length-1)); };
  let g = "";
  [0,25,50,75,100].forEach(function(v){
    g += '<line x1="'+PL+'" y1="'+sc(v)+'" x2="'+(W-PR)+'" y2="'+sc(v)+'" stroke="var(--grid)" stroke-width="1"/>'
      + '<text x="'+(PL-6)+'" y="'+(sc(v)+3.5)+'" text-anchor="end" font-size="10" fill="var(--axis)">'+v+'</text>';
  });
  const avg = Math.round(pts.reduce(function(a,p){ return a+p.v; },0)/pts.length);
  g += '<line x1="'+PL+'" y1="'+sc(avg)+'" x2="'+(W-PR)+'" y2="'+sc(avg)+'" stroke="var(--accent)" stroke-width="1.4" stroke-dasharray="6 4"/>'
    + '<text x="'+(W-PR)+'" y="'+(sc(avg)-5)+'" text-anchor="end" font-size="10" font-weight="700" fill="var(--accent)">Ø '+avg+' %</text>';
  let d = "", dots = "";
  pts.forEach(function(p,i){
    d += (i?" L":"M")+xs(i).toFixed(1)+" "+sc(p.v).toFixed(1);
    const tip = "<b>"+esc(fmtDate(p.x))+"</b><div class=\"tr\"><span>Anwesenheitsquote</span><b>"+p.v+" %</b></div><div class=\"tr\"><span>Kader erfasst</span><b>"+p.n+"</b></div>";
    dots += '<circle cx="'+xs(i).toFixed(1)+'" cy="'+sc(p.v).toFixed(1)+'" r="4" fill="var(--viz-bar)" stroke="var(--surface)" stroke-width="2" data-tip="'+esc(tip).replace(/"/g,"&quot;")+'"/>';
  });
  const first = fmtShort(pts[0].x), last = fmtShort(pts[pts.length-1].x);
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Anwesenheitsquote im Verlauf in Prozent">'+g
    + '<path d="'+d+'" fill="none" stroke="var(--viz-bar)" stroke-width="2"/>'+dots
    + '<text x="'+PL+'" y="'+(H-6)+'" font-size="9.5" fill="var(--axis)">'+esc(first)+'</text>'
    + '<text x="'+(W-PR)+'" y="'+(H-6)+'" text-anchor="end" font-size="9.5" fill="var(--axis)">'+esc(last)+'</text></svg>';
}
function barRows(rows, unit, maxOverride){
  if(!rows.length) return '<p style="color:var(--muted);font-size:.9rem">Keine Daten im gewählten Zeitraum.</p>';
  const max = maxOverride || Math.max.apply(null, rows.map(function(r){ return r.v; }).concat([1]));
  return rows.map(function(r){
    const w = Math.max(r.v>0?2:0, r.v/max*100);
    const tip = "<b>"+esc(r.n)+"</b><div class=\"tr\"><span>"+esc(r.tipLabel||"Wert")+"</span><b>"+r.v+(unit||"")+"</b></div>"+(r.sub?'<div style="color:var(--muted)">'+esc(r.sub)+"</div>":"");
    return '<div class="bar-row" data-tip="'+esc(tip).replace(/"/g,"&quot;")+'">'
      + '<span class="lb" title="'+esc(r.n)+'">'+esc(r.n)+'</span>'
      + '<span class="bar-track"><span class="bar-fill" style="width:'+w.toFixed(1)+'%'+(r.col?';background:'+r.col:"")+'"></span></span>'
      + '<span class="vl">'+r.v+(unit||"")+"</span></div>";
  }).join("");
}
function heatTable(rowKeys, colKeys, get, rowName, colName, maxOverride){
  if(!rowKeys.length || !colKeys.length) return '<p style="color:var(--muted);font-size:.9rem">Noch keine Themen erfasst.</p>';
  let max = maxOverride || 1;
  if(!maxOverride) rowKeys.forEach(function(r){ colKeys.forEach(function(c){ max = Math.max(max, get(r,c)); }); });
  let h = '<div class="hm-wrap"><table class="hm"><thead><tr><th></th>';
  colKeys.forEach(function(c){ h += '<th class="col">'+esc(colName(c))+"</th>"; });
  h += '<th class="col">Σ</th></tr></thead><tbody>';
  rowKeys.forEach(function(r){
    let sum = 0;
    h += "<tr><th>"+esc(rowName(r))+"</th>";
    colKeys.forEach(function(c){
      const v = get(r,c); sum += v;
      const mix = v===0 ? 0 : 14 + Math.round(v/max*58);
      const tip = "<b>"+esc(rowName(r))+"</b><div>"+esc(colName(c))+"</div><div class=\"tr\"><span>Einheiten</span><b>"+v+"</b></div>";
      h += '<td class="c" style="background:color-mix(in srgb, var(--viz-bar) '+mix+'%, var(--surface));color:var(--ink)" data-tip="'+esc(tip).replace(/"/g,"&quot;")+'">'+(v||"")+"</td>";
    });
    h += '<td class="c" style="font-weight:700;background:var(--surface-2)">'+sum+"</td></tr>";
  });
  return h + "</tbody></table></div>";
}
const ATT_LEGEND = '<div class="legend">'+ATT.map(function(a){
  return '<span><i style="background:'+a.c+'"></i>'+a.n+"</span>";
}).join("")+"</div>";
</script>
